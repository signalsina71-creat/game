<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>شکارچی واژه</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:#49372a;
    background:
        radial-gradient(circle at 15% 20%,#ffffffaa 0 4%,transparent 5%),
        radial-gradient(circle at 85% 70%,#ffffff77 0 5%,transparent 6%),
        linear-gradient(135deg,#b9d8cf,#ead9b9 55%,#c6d9c2);
    overflow-x:hidden;
}

.game{
    width:95%;
    max-width:1100px;
    margin:18px auto 35px;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    overflow:hidden;
    background:linear-gradient(145deg,#fffdf3,#f0dfbb);
    border:4px solid #9b7953;
    border-radius:28px;
    padding:20px;
    text-align:center;
    box-shadow:0 12px 25px #0004;
}

.header:after{
    content:"✦";
    position:absolute;
    font-size:70px;
    left:30px;
    top:-25px;
    color:#d7b56d;
    transform:rotate(20deg);
}

.header h1{
    margin:0;
    color:#6d4728;
    font-size:38px;
    text-shadow:0 2px 0 #fff;
}

.header p{
    margin:8px 0 0;
    font-size:17px;
}

/* =========================
   STATS
========================= */

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:15px 0;
}

.stat{
    background:#fff9e9;
    border:2px solid #b59469;
    border-radius:18px;
    padding:9px 20px;
    min-width:135px;
    text-align:center;
    box-shadow:0 5px 12px #0002;
}

.stat strong{
    display:block;
    color:#70451f;
    font-size:22px;
    margin-top:4px;
}

/* =========================
   NOTEBOOK
========================= */

.notebook{
    position:relative;
    min-height:680px;
    padding:35px 55px;
    background:
        repeating-linear-gradient(
            to bottom,
            #fffdf5 0,
            #fffdf5 38px,
            #d7e2ef 39px,
            #fffdf5 40px
        );
    border:5px solid #a98961;
    border-radius:22px 28px 25px 20px;
    box-shadow:
        0 20px 35px #0005,
        inset 8px 0 15px #00000012;
    perspective:1600px;
    overflow:hidden;
}

.notebook:before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    right:82px;
    width:2px;
    background:#efaaa0;
    z-index:1;
}

.notebook:after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:15px;
    border:1px solid #ffffff88;
    pointer-events:none;
}

.page{
    position:relative;
    z-index:3;
    transform-origin:right center;
    backface-visibility:hidden;
}

/* ورق خوردن واقعی‌تر */

.page.turning{
    animation:
        pageTurn .95s cubic-bezier(.55,.05,.45,.95);
}

@keyframes pageTurn{

    0%{
        transform:
            rotateY(0deg)
            translateX(0)
            skewY(0deg);
        box-shadow:none;
    }

    20%{
        transform:
            rotateY(-22deg)
            translateX(-5px)
            skewY(1deg);
        box-shadow:
            -15px 8px 22px #0003;
    }

    45%{
        transform:
            rotateY(-72deg)
            translateX(-25px)
            skewY(3deg);
        box-shadow:
            -30px 12px 35px #0005;
    }

    65%{
        transform:
            rotateY(-120deg)
            translateX(-35px)
            skewY(5deg);
        box-shadow:
            -25px 10px 30px #0004;
    }

    82%{
        transform:
            rotateY(-165deg)
            translateX(-12px)
            skewY(2deg);
        box-shadow:
            -10px 5px 18px #0002;
    }

    100%{
        transform:
            rotateY(0deg)
            translateX(0)
            skewY(0deg);
        box-shadow:none;
    }
}

/* گوشه صفحه */

.page-corner{
    position:absolute;
    left:12px;
    bottom:5px;
    width:55px;
    height:55px;
    background:linear-gradient(
        135deg,
        transparent 50%,
        #e5d5b6 51%
    );
    border-radius:0 0 0 8px;
    opacity:.7;
}

/* =========================
   CHAPTER
========================= */

.chapter{
    text-align:center;
    font-weight:bold;
    color:#7b5633;
    font-size:18px;
    margin-bottom:10px;
}

.instruction{
    max-width:850px;
    margin:15px auto;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    line-height:2;
}

/* =========================
   FANTASY HOURGLASS
========================= */

.timer-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    margin:8px;
}

.timer-number{
    font-size:24px;
    font-weight:bold;
    color:#71451f;
}

.hourglass{
    position:relative;
    width:75px;
    height:100px;
    filter:drop-shadow(0 5px 5px #0003);
}

.hourglass .cap{
    position:absolute;
    left:8px;
    width:59px;
    height:11px;
    background:linear-gradient(90deg,#7a4c2c,#d4a65f,#7a4c2c);
    border-radius:7px;
    z-index:5;
}

.hourglass .cap.top{
    top:0;
}

.hourglass .cap.bottom{
    bottom:0;
}

.hourglass .glass{
    position:absolute;
    left:14px;
    top:9px;
    width:47px;
    height:82px;
    overflow:hidden;
    background:rgba(210,240,255,.32);
    border-left:3px solid #8b6a4b;
    border-right:3px solid #8b6a4b;
    clip-path:polygon(
        0 0,
        100% 0,
        70% 43%,
        100% 100%,
        0 100%,
        30% 43%
    );
}

.hourglass .sand-top{
    position:absolute;
    top:5px;
    left:5px;
    right:5px;
    height:30px;
    background:linear-gradient(180deg,#f4c45c,#d99732);
    clip-path:polygon(
        0 0,100% 0,72% 100%,28% 100%
    );
    transition:.4s;
}

.hourglass .sand-bottom{
    position:absolute;
    bottom:5px;
    left:5px;
    right:5px;
    height:5px;
    background:linear-gradient(180deg,#f4c45c,#d99732);
    border-radius:50% 50% 25% 25%;
    transition:.4s;
}

.hourglass .stream{
    position:absolute;
    top:34px;
    left:21px;
    width:4px;
    height:28px;
    background:#e3a33c;
    border-radius:4px;
}

.hourglass.warning .sand-top,
.hourglass.warning .sand-bottom,
.hourglass.warning .stream{
    background:linear-gradient(
        180deg,
        #ff7665,
        #d52f3c
    );
}

.hourglass.warning{
    animation:hourWarning .45s infinite alternate;
}

@keyframes hourWarning{
    from{
        transform:rotate(-2deg) scale(1);
    }
    to{
        transform:rotate(2deg) scale(1.05);
    }
}

/* =========================
   FANTASY PICTURE
========================= */

.picture-card{
    width:220px;
    height:160px;
    margin:8px auto 14px;
    border-radius:30px;
    background:
        radial-gradient(circle at 20% 20%,#ffffffaa 0 4%,transparent 5%),
        linear-gradient(145deg,#dff1e2,#f6e6b9);
    border:3px solid #a6885f;
    box-shadow:
        0 8px 15px #0003,
        inset 0 0 20px #ffffff88;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

svg{
    width:155px;
    height:125px;
}

/* =========================
   QUESTION
========================= */

.question-box{
    max-width:850px;
    margin:12px auto;
    padding:18px;
    background:#fffdf5cc;
    border:2px dashed #ad8b60;
    border-radius:20px;
    text-align:center;
}

.question{
    font-size:20px;
    line-height:2;
}

.target{
    color:#75461f;
    font-size:27px;
    font-weight:bold;
    margin-top:10px;
}

.blank{
    display:inline-block;
    min-width:130px;
    border-bottom:4px solid #73451f;
    color:#54824a;
}

/* =========================
   OPTIONS
========================= */

.options{
    max-width:800px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.option{
    min-height:70px;
    border:3px solid #b49266;
    border-radius:18px;
    background:#fff8e8;
    color:#513a27;
    font-family:Tahoma;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 0 #98754f;
    transition:.2s;
}

.option:hover{
    transform:translateY(-4px) rotate(-1deg);
    background:#fff0c9;
}

.option.correct{
    background:#bfe4b8;
    border-color:#4c9650;
    box-shadow:0 5px 0 #39743e;
}

.option.wrong{
    background:#f1b1a8;
    border-color:#c44b42;
    box-shadow:0 5px 0 #96372f;
    animation:wrong .25s;
}

@keyframes wrong{
    25%{transform:translateX(5px)}
    50%{transform:translateX(-5px)}
    75%{transform:translateX(4px)}
}

/* =========================
   MESSAGE
========================= */

.message{
    min-height:45px;
    text-align:center;
    font-size:19px;
    font-weight:bold;
}

/* =========================
   NEXT
========================= */

.next{
    display:none;
    margin:8px auto 15px;
    padding:14px 35px;
    border:0;
    border-radius:18px;
    background:linear-gradient(135deg,#6d995e,#4f7847);
    color:white;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #36572f;
}

.next:hover{
    transform:translateY(-2px);
}

/* =========================
   PROGRESS
========================= */

.progress{
    height:13px;
    background:#e1d2b8;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #a78a65;
}

.progress-bar{
    width:0;
    height:100%;
    background:linear-gradient(
        90deg,
        #6c9b5d,
        #d6a849,
        #edce77
    );
    transition:.5s;
}

/* =========================
   RESULT
========================= */

.result{
    display:none;
    text-align:center;
    padding:40px;
    background:#fffaf0;
    border:4px solid #a48259;
    border-radius:28px;
    box-shadow:0 15px 30px #0004;
}

.result h2{
    color:#71451f;
    font-size:30px;
}

.final-score{
    font-size:60px;
    color:#b17528;
    font-weight:bold;
}

.restart{
    border:0;
    padding:15px 30px;
    border-radius:17px;
    background:#5c8850;
    color:white;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .notebook{
        padding:30px 18px;
    }

    .notebook:before{
        right:35px;
    }

    .header h1{
        font-size:29px;
    }

    .instruction{
        font-size:18px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .picture-card{
        width:190px;
        height:145px;
    }

    .timer-area{
        gap:10px;
    }
}
</style>
</head>

/* =====================================================
   متغیرها
===================================================== */

let current=0;
let score=0;
let correct=0;
let badges=0;
let time=30;
let timerInterval=null;
let answered=false;


/* =====================================================
   نمایش تصویر
===================================================== */

function showPicture(name){

    document.getElementById("picture").innerHTML=
        pictures[name] || "";

}


/* =====================================================
   بارگذاری سؤال
===================================================== */

function loadQuestion(){

    clearInterval(timerInterval);

    answered=false;
    time=30;

    const q=questions[current];

    document.getElementById("stage").innerText=
        current+1;

    document.getElementById("chapter").innerText=
        q.chapter;

    document.getElementById("instruction").innerText=
        q.instruction;

    showPicture(q.picture);

    document.getElementById("question").innerText=
        q.question;

    document.getElementById("target").innerText=
        q.target ? "🎯 واژه هدف: "+q.target : "";

    document.getElementById("message").innerText="";

    document.getElementById("next").style.display=
        "none";

    document.getElementById("timer").innerText=
        "30";

    document.getElementById("hourglass")
        .classList.remove("warning");

    document.getElementById("sandTop")
        .style.height="30px";

    document.getElementById("sandBottom")
        .style.height="5px";

    createOptions(q);

    updateProgress();

    startTimer();
}


/* =====================================================
   گزینه‌ها
===================================================== */

function createOptions(q){

    const area=document.getElementById("options");

    area.innerHTML="";

    let options=[...q.options];

    options.sort(()=>Math.random()-0.5);

    options.forEach(text=>{

        const button=document.createElement("button");

        button.className="option";

        button.innerText=text;

        button.onclick=()=>{
            checkAnswer(button,text);
        };

        area.appendChild(button);

    });
}


/* =====================================================
   تایمر
===================================================== */

function startTimer(){

    timerInterval=setInterval(()=>{

        time--;

        document.getElementById("timer").innerText=
            time;

        const topHeight=
            Math.max(0,(time/30)*30);

        const bottomHeight=
            Math.min(
                32,
                5+((30-time)/30)*27
            );

        document.getElementById("sandTop")
            .style.height=
            topHeight+"px";

        document.getElementById("sandBottom")
            .style.height=
            bottomHeight+"px";


        if(time<=10){

            document.getElementById("hourglass")
                .classList.add("warning");

        }


        if(time<=0){

            clearInterval(timerInterval);

            if(!answered){

                answered=true;

                document.getElementById("message").innerText=
                    "⏰ زمان تمام شد! این بار با دقت بیشتری تمرین کن.";

                document.getElementById("message").style.color=
                    "#bd4b3e";

                showCorrect();

                document.getElementById("next")
                    .style.display="block";

            }

        }

    },1000);

}


/* =====================================================
   بررسی پاسخ
===================================================== */

function checkAnswer(button,text){

    if(answered)return;

    const q=questions[current];

    if(text===q.answer){

        answered=true;

        clearInterval(timerInterval);

        button.classList.add("correct");

        score+=10+time;

        correct++;

        badges++;

        document.getElementById("score").innerText=
            score;

        document.getElementById("correct").innerText=
            correct;

        document.getElementById("badges").innerText=
            badges;

        document.getElementById("message").innerText=
            "🎯 آفرین! واژه را درست شکار کردی.";

        document.getElementById("message").style.color=
            "#438047";

        disableOptions();

        document.getElementById("next")
            .style.display="block";

    }else{

        button.classList.add("wrong");

        document.getElementById("message").innerText=
            "🔎 این واژه درست نیست؛ دوباره با دقت نگاه کن.";

        document.getElementById("message").style.color=
            "#bd4b3e";

        setTimeout(()=>{
            button.classList.remove("wrong");
        },600);

    }

}


/* =====================================================
   پاسخ صحیح بعد از اتمام زمان
===================================================== */

function showCorrect(){

    const answer=
        questions[current].answer;

    document.querySelectorAll(".option")
        .forEach(button=>{

            if(button.innerText===answer){

                button.classList.add("correct");

            }

            button.disabled=true;

        });

}


/* =====================================================
   غیرفعال کردن گزینه‌ها
===================================================== */

function disableOptions(){

    document.querySelectorAll(".option")
        .forEach(button=>{

            button.disabled=true;

        });

}


/* =====================================================
   ورق زدن
===================================================== */

function nextQuestion(){

    clearInterval(timerInterval);

    const page=
        document.getElementById("page");

    page.classList.remove("turning");

    void page.offsetWidth;

    page.classList.add("turning");

    setTimeout(()=>{

        current++;

        if(current>=questions.length){

            finishGame();

        }else{

            loadQuestion();

        }

    },650);

}


/* =====================================================
   پیشرفت
===================================================== */

function updateProgress(){

    const percent=
        ((current+1)/questions.length)*100;

    document.getElementById("progress")
        .style.width=
        percent+"%";

}


/* =====================================================
   پایان بازی
===================================================== */

function finishGame(){

    clearInterval(timerInterval);

    document.querySelector(".notebook")
        .style.display="none";

    document.getElementById("result")
        .style.display="block";

    document.getElementById("finalScore")
        .innerText=score;

    document.getElementById("finalCorrect")
        .innerText=correct;

    const percent=
        Math.round(
            correct/questions.length*100
        );

    document.getElementById("finalPercent")
        .innerText=percent+"%";

    let message="";

    if(percent>=90){

        message=
        "🏆 فوق‌العاده! تو استاد شکار واژه‌ها هستی.";

    }else if(percent>=75){

        message=
        "🌟 خیلی خوب بود! دقت واژه‌ای تو عالی است.";

    }else if(percent>=50){

        message=
        "👏 خوب بود! با کمی تمرین حرفه‌ای‌تر می‌شوی.";

    }else{

        message=
        "📚 دوباره دفتر را باز کن و تمرین کن؛ موفق می‌شوی.";

    }

    document.getElementById("finalMessage")
        .innerText=message;

}


/* =====================================================
   شروع دوباره
===================================================== */

function restartGame(){

    current=0;
    score=0;
    correct=0;
    badges=0;

    document.getElementById("score").innerText=0;
    document.getElementById("correct").innerText=0;
    document.getElementById("badges").innerText=0;

    document.querySelector(".notebook")
        .style.display="block";

    document.getElementById("result")
        .style.display="none";

    loadQuestion();

}


/* =====================================================
   شروع
===================================================== */

loadQuestion();

</script>
