<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>شکارچی واژه</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    color:#3f3025;
    background:
        radial-gradient(circle at 15% 15%,#fff8df 0 8%,transparent 9%),
        linear-gradient(135deg,#d7e8d2,#f4e4c4);
}

.game{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

/* ---------- عنوان ---------- */

.header{
    background:linear-gradient(135deg,#fffaf0,#f1dfbc);
    border:3px solid #9b7951;
    border-radius:25px;
    padding:18px;
    text-align:center;
    box-shadow:0 8px 20px #0003;
}

.header h1{
    margin:0;
    font-size:36px;
    color:#70451f;
}

.header p{
    margin:8px 0 0;
    font-size:16px;
}

/* ---------- اطلاعات ---------- */

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:15px 0;
}

.stat{
    background:#fff8e8;
    border:2px solid #b9996d;
    border-radius:16px;
    padding:8px 20px;
    min-width:140px;
    text-align:center;
    box-shadow:0 4px 10px #0002;
}

.stat strong{
    display:block;
    font-size:22px;
    color:#74461f;
}

/* ---------- دفتر ---------- */

.notebook{
    position:relative;
    background:#fffdf5;
    border:5px solid #b89b72;
    border-radius:20px;
    min-height:650px;
    padding:35px 45px;
    box-shadow:0 15px 35px #0004;
    overflow:hidden;
}

/* خط دفتر */

.notebook:before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 38px,
        #c8d9ed 39px,
        transparent 40px
      );
    opacity:.6;
    pointer-events:none;
}

.margin-line{
    position:absolute;
    right:70px;
    top:0;
    bottom:0;
    width:2px;
    background:#efaaa0;
    opacity:.7;
}

.page{
    position:relative;
    z-index:2;
}

/* ---------- ورق خوردن ---------- */

.page.turn{
    animation:turnPage .7s ease;
}

@keyframes turnPage{
    0%{
        transform:rotateY(0deg);
        opacity:1;
    }
    45%{
        transform:rotateY(-75deg);
        opacity:.2;
    }
    100%{
        transform:rotateY(0deg);
        opacity:1;
    }
}

.chapter{
    text-align:center;
    color:#76502c;
    font-weight:bold;
    font-size:18px;
}

.instruction{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    line-height:2;
    margin:18px auto;
    max-width:800px;
}

/* ---------- ساعت شنی ---------- */

.timer-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    margin:10px;
}

.timer-number{
    font-size:25px;
    font-weight:bold;
    color:#76502c;
}

.hourglass{
    width:58px;
    height:76px;
    position:relative;
}

.glass{
    position:absolute;
    width:58px;
    height:76px;
    border:4px solid #76502c;
    border-radius:8px;
    overflow:hidden;
    background:#fff;
    clip-path:polygon(
        0 0,100% 0,100% 10%,
        58% 45%,100% 90%,100% 100%,
        0 100%,0 90%,42% 45%,0 10%
    );
}

.sand-top{
    position:absolute;
    top:6px;
    left:8px;
    right:8px;
    height:29px;
    background:#d69a45;
    border-radius:3px;
    transition:.4s;
}

.sand-bottom{
    position:absolute;
    bottom:6px;
    left:8px;
    right:8px;
    height:0;
    background:#d69a45;
    border-radius:50%;
    transition:.4s;
}

.sand-stream{
    position:absolute;
    top:35px;
    left:27px;
    width:4px;
    height:25px;
    background:#d69a45;
    transition:.4s;
}

.hourglass.warning .sand-top,
.hourglass.warning .sand-bottom,
.hourglass.warning .sand-stream{
    background:#df4d42;
}

.hourglass.warning{
    animation:shake .5s infinite;
}

@keyframes shake{
    0%,100%{transform:rotate(0)}
    25%{transform:rotate(-3deg)}
    75%{transform:rotate(3deg)}
}

/* ---------- تصویر ---------- */

.picture{
    text-align:center;
    font-size:90px;
    margin:5px;
}

/* ---------- سؤال ---------- */

.question-box{
    background:rgba(255,255,255,.68);
    border:2px dashed #aa8b60;
    border-radius:20px;
    padding:20px;
    max-width:850px;
    margin:10px auto 20px;
}

.target{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    color:#74461f;
    margin:10px;
}

.blank{
    display:inline-block;
    min-width:150px;
    border-bottom:4px solid #74461f;
    margin:0 8px;
    color:#327050;
}

/* ---------- گزینه‌ها ---------- */

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    max-width:800px;
    margin:20px auto;
}

.option{
    border:3px solid #b08d62;
    background:#fff8e8;
    color:#513a26;
    border-radius:18px;
    min-height:70px;
    padding:12px;
    font-family:Tahoma;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 0 #9b7951;
    transition:.2s;
}

.option:hover{
    transform:translateY(-4px);
    background:#fff1ce;
}

.option.correct{
    background:#bfe4b8;
    border-color:#4d9852;
    box-shadow:0 5px 0 #39753d;
}

.option.wrong{
    background:#f2b5aa;
    border-color:#c94d42;
    box-shadow:0 5px 0 #96372f;
}

/* ---------- جورچین ---------- */

.puzzle{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:20px;
}

.letter{
    width:58px;
    height:58px;
    display:flex;
    justify-content:center;
    align-items:center;
    border:3px solid #b08d62;
    border-radius:14px;
    background:#fff6d9;
    font-size:25px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 0 #9b7951;
}

.letter.selected{
    background:#d4e9c7;
    transform:translateY(-5px);
}

/* ---------- پیام ---------- */

.message{
    min-height:45px;
    text-align:center;
    font-size:19px;
    font-weight:bold;
}

/* ---------- دکمه ---------- */

.next{
    display:none;
    margin:10px auto;
    border:0;
    background:#5d8750;
    color:white;
    padding:14px 35px;
    border-radius:18px;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #3c5e35;
}

.next:hover{
    background:#719f61;
}

/* ---------- پیشرفت ---------- */

.progress{
    margin-top:20px;
}

.progress-bar{
    height:13px;
    width:0;
    background:linear-gradient(90deg,#6e9d5e,#e0b65d);
    border-radius:20px;
    transition:.5s;
}

/* ---------- پایان ---------- */

.result{
    display:none;
    text-align:center;
    background:#fffaf0;
    border:4px solid #a48259;
    border-radius:25px;
    padding:35px;
    box-shadow:0 12px 30px #0004;
}

.result h2{
    color:#70451f;
    font-size:30px;
}

.final-score{
    font-size:55px;
    color:#a36b28;
    font-weight:bold;
}

.restart{
    border:0;
    background:#5d8750;
    color:white;
    padding:15px 30px;
    border-radius:16px;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
}

/* ---------- موبایل ---------- */

@media(max-width:650px){

    .notebook{
        padding:25px 20px;
    }

    .margin-line{
        right:35px;
    }

    .header h1{
        font-size:28px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .instruction{
        font-size:19px;
    }

    .picture{
        font-size:70px;
    }
}
</style>
</head>


<body>

<div class="game">

<div class="header">
    <h1>📒 شکارچی واژه</h1>
    <p>دفتر اسرارآمیز واژه‌ها را باز کن و مأموریت‌ها را کامل کن!</p>
</div>


<div class="stats">

<div class="stat">
🔎 امتیاز
<strong id="score">0</strong>
</div>

<div class="stat">
🏅 نشان
<strong id="badges">0</strong>
</div>

<div class="stat">
📖 صفحه
<strong id="stage">1</strong>
</div>

<div class="stat">
🎯 درست
<strong id="correct">0</strong>
</div>

</div>


<div class="notebook">

<div class="margin-line"></div>

<div class="page" id="page">

<div class="chapter" id="chapter">
مأموریت اول
</div>

<div class="timer-area">

<div class="hourglass" id="hourglass">

<div class="glass"></div>

<div class="sand-top" id="sandTop"></div>

<div class="sand-stream" id="sandStream"></div>

<div class="sand-bottom" id="sandBottom"></div>

</div>

<div class="timer-number">
<span id="timer">30</span> ثانیه
</div>

</div>


<div class="instruction" id="instruction"></div>

<div class="picture" id="picture"></div>

<div class="question-box">

<div id="question"></div>

<div class="target" id="target"></div>

</div>

<div id="puzzleArea"></div>

<div class="options" id="options"></div>

<div class="message" id="message"></div>

<button class="next" id="next" onclick="nextQuestion()">
📖 ورق بعدی
</button>


<div class="progress">

<div class="progress-bar" id="progress"></div>

</div>

</div>

</div>


<div class="result" id="result">

<h2>🏆 دفتر واژه‌ها کامل شد!</h2>

<p>تو با موفقیت تمام مأموریت‌های شکارچی واژه را انجام دادی.</p>

<div class="final-score" id="finalScore">0</div>

<p>
پاسخ‌های درست:
<strong id="finalCorrect">0</strong>
از ۲۰
</p>

<p>
درصد موفقیت:
<strong id="finalPercent">0%</strong>
</p>

<h3 id="finalMessage"></h3>

<button class="restart" onclick="restartGame()">
🔄 شروع دوباره
</button>

</div>

</div>


<script>

/* =================================================
   اطلاعات بازی
================================================= */

const questions=[

/* ---------- مأموریت ۱ ---------- */

{
type:"تصویر",
chapter:"مأموریت ۱ | کارآگاه تصویر",
instruction:"به تصویر نگاه کن و واژه مناسب را پیدا کن.",
picture:"✏️",
question:"این تصویر کدام واژه را نشان می‌دهد؟",
options:["مداد","کتاب","دفتر","پاک‌کن"],
answer:"مداد"
},

{
type:"تصویر",
chapter:"مأموریت ۱ | کارآگاه تصویر",
instruction:"به تصویر نگاه کن.",
picture:"📚",
question:"کدام واژه با تصویر ارتباط دارد؟",
options:["کتاب","مداد","کیف","میز"],
answer:"کتاب"
},

{
type:"تصویر",
chapter:"مأموریت ۱ | کارآگاه تصویر",
instruction:"واژه مناسب تصویر را شکار کن.",
picture:"🌳",
question:"این تصویر چیست؟",
options:["درخت","گل","جنگل","برگ"],
answer:"درخت"
},

{
type:"تصویر",
chapter:"مأموریت ۱ | کارآگاه تصویر",
instruction:"با دقت تصویر را بررسی کن.",
picture:"🐟",
question:"کدام واژه درست است؟",
options:["ماهی","پرنده","خرگوش","اسب"],
answer:"ماهی"
},

/* ---------- مأموریت ۲ ---------- */

{
type:"جورچین",
chapter:"مأموریت ۲ | دفتر به‌هم‌ریخته",
instruction:"حروف واژه به‌هم ریخته‌اند. واژه درست را پیدا کن.",
picture:"🍎",
question:"کدام گزینه واژه درست را می‌سازد؟",
target:"س ـ ی ـ ب",
options:["سیب","سبی","سیبک","سب"],
answer:"سیب"
},

{
type:"جورچین",
chapter:"مأموریت ۲ | دفتر به‌هم‌ریخته",
instruction:"حروف را در ذهنت مرتب کن.",
picture:"🌸",
question:"واژه درست کدام است؟",
target:"گ ـ ل",
options:["گل","گِل","گال","گول"],
answer:"گل"
},

{
type:"جورچین",
chapter:"مأموریت ۲ | دفتر به‌هم‌ریخته",
instruction:"جورچین واژه را حل کن.",
picture:"🐰",
question:"واژه درست کدام است؟",
target:"خ ـ ر ـ گ ـ و ـ ش",
options:["خرگوش","خرگوشک","گرگوش","خرگوشی"],
answer:"خرگوش"
},

{
type:"جورچین",
chapter:"مأموریت ۲ | دفتر به‌هم‌ریخته",
instruction:"حروف را مرتب کن و پاسخ را پیدا کن.",
picture:"🌧️",
question:"کدام واژه درست است؟",
target:"ب ـ ا ـ ر ـ ا ـ ن",
options:["باران","بهاران","بارون","بار"],
answer:"باران"
},

/* ---------- مأموریت ۳ ---------- */

{
type:"جای خالی",
chapter:"مأموریت ۳ | جای خالی",
instruction:"جای خالی را با واژه مناسب کامل کن.",
picture:"🌳",
question:"در حیاط مدرسه یک ______ بزرگ وجود دارد.",
target:"درخت",
options:["درخت","درد","دریا","در"],
answer:"درخت"
},

{
type:"جای خالی",
chapter:"مأموریت ۳ | جای خالی",
instruction:"واژه مناسب را انتخاب کن.",
picture:"☔",
question:"امروز ______ می‌بارد.",
target:"باران",
options:["باران","بارانک","ابر","باد"],
answer:"باران"
},

{
type:"جای خالی",
chapter:"مأموریت ۳ | جای خالی",
instruction:"جمله را کامل کن.",
picture:"📖",
question:"من هر شب یک ______ می‌خوانم.",
target:"کتاب",
options:["کتاب","کباب","کتابی","کتابچه"],
answer:"کتاب"
},

{
type:"جای خالی",
chapter:"مأموریت ۳ | جای خالی",
instruction:"واژه مناسب را شکار کن.",
picture:"🐦",
question:"یک ______ روی شاخه نشست.",
target:"پرنده",
options:["پرنده","پرواز","پرچم","پروانه"],
answer:"پرنده"
},

/* ---------- مأموریت ۴ ---------- */

{
type:"تشخیص واژه",
chapter:"مأموریت ۴ | شکار اشتباه",
instruction:"واژه درست را با دقت از میان واژه‌های مشابه پیدا کن.",
picture:"🔎",
question:"کدام واژه دقیقاً «یادگیری» است؟",
target:"یادگیری",
options:["یادگیری","یادگار","یادداشت","یادگیر"],
answer:"یادگیری"
},

{
type:"تشخیص واژه",
chapter:"مأموریت ۴ | شکار اشتباه",
instruction:"به ساختار واژه دقت کن.",
picture:"🧠",
question:"کدام واژه دقیقاً «تمرکز» است؟",
target:"تمرکز",
options:["تمرکز","تمرین","تکلیف","تمرکزگر"],
answer:"تمرکز"
},

{
type:"تشخیص واژه",
chapter:"مأموریت ۴ | شکار اشتباه",
instruction:"فقط واژه هدف را انتخاب کن.",
picture:"🌙",
question:"کدام واژه دقیقاً «ماهتاب» نیست، بلکه واژه هدف «مهتاب» است؟",
target:"مهتاب",
options:["مهتاب","ماهتاب","مهتابی","مه"],
answer:"مهتاب"
},

{
type:"تشخیص واژه",
chapter:"مأموریت ۴ | شکار اشتباه",
instruction:"چشم شکارچی را تیز کن.",
picture:"🌿",
question:"کدام واژه دقیقاً «سبزه» است؟",
target:"سبزه",
options:["سبزه","سبز","سبزی","سبزه‌زار"],
answer:"سبزه"
},

/* ---------- مأموریت ۵ ---------- */

{
type:"ترکیبی",
chapter:"مأموریت ۵ | آزمون نهایی",
instruction:"آخرین مأموریت این صفحه را حل کن.",
picture:"🦋",
question:"پروانه روی گل نشست. واژه مناسب کدام است؟",
target:"پروانه",
options:["پروانه","پرنده","پروانه‌وار","پرویز"],
answer:"پروانه"
},

{
type:"ترکیبی",
chapter:"مأموریت ۵ | آزمون نهایی",
instruction:"تصویر و جمله را با هم بررسی کن.",
picture:"🏫",
question:"دانش‌آموزان وارد ______ شدند.",
target:"مدرسه",
options:["مدرسه","مدرس","مداد","مسجد"],
answer:"مدرسه"
},

{
type:"ترکیبی",
chapter:"مأموریت ۵ | آزمون نهایی",
instruction:"به تصویر و واژه‌ها دقت کن.",
picture:"🏞️",
question:"در دوردست یک ______ بلند دیده می‌شود.",
target:"کوه",
options:["کوه","کود","کور","کوهستان"],
answer:"کوه"
},

{
type:"ترکیبی",
chapter:"مأموریت ۵ | آزمون نهایی",
instruction:"آخرین واژه را شکار کن!",
picture:"🏆",
question:"دانش‌آموزی که واژه‌ها را پیدا می‌کند یک ______ است.",
target:"شکارچی",
options:["شکارچی","شکار","شکاری","شکارگاه"],
answer:"شکارچی"
}

];


/* =================================================
   متغیرها
================================================= */

let current=0;
let score=0;
let correct=0;
let badges=0;
let time=30;
let timerInterval=null;
let answered=false;


/* =================================================
   بارگذاری سؤال
================================================= */

function loadQuestion(){

    clearInterval(timerInterval);

    answered=false;
    time=30;

    const q=questions[current];

    document.getElementById("stage").innerText=current+1;

    document.getElementById("chapter").innerText=q.chapter;

    document.getElementById("instruction").innerText=
        q.instruction;

    document.getElementById("picture").innerText=
        q.picture;

    document.getElementById("question").innerText=
        q.question;

    document.getElementById("target").innerText=
        q.target ? "🎯 واژه هدف: "+q.target : "";

    document.getElementById("message").innerText="";

    document.getElementById("next").style.display="none";

    document.getElementById("timer").innerText="30";

    document.getElementById("hourglass")
        .classList.remove("warning");

    document.getElementById("sandTop").style.height="29px";

    document.getElementById("sandBottom").style.height="0";

    createOptions(q);

    updateProgress();

    startTimer();

}


/* =================================================
   ساخت گزینه‌ها
================================================= */

function createOptions(q){

    const area=document.getElementById("options");

    area.innerHTML="";

    let options=[...q.options];

    options.sort(()=>Math.random()-0.5);

    options.forEach(text=>{

        const button=document.createElement("button");

        button.className="option";

        button.innerText=text;

        button.onclick=()=>checkAnswer(button,text);

        area.appendChild(button);

    });

}


/* =================================================
   تایمر
================================================= */

function startTimer(){

    timerInterval=setInterval(()=>{

        time--;

        document.getElementById("timer").innerText=time;

        const top=
            Math.max(0,(time/30)*29);

        const bottom=
            Math.min(29,((30-time)/30)*29);

        document.getElementById("sandTop").style.height=
            top+"px";

        document.getElementById("sandBottom").style.height=
            bottom+"px";


        if(time<=10){

            document.getElementById("hourglass")
                .classList.add("warning");

        }


        if(time<=0){

            clearInterval(timerInterval);

            if(!answered){

                answered=true;

                document.getElementById("message").innerText=
                    "⏰ زمان تمام شد! پاسخ درست را ببین و برای صفحه بعد آماده شو.";

                document.getElementById("message").style.color=
                    "#bd4b3e";

                showCorrect();

                document.getElementById("next").style.display=
                    "block";

            }

        }

    },1000);

}


/* =================================================
   بررسی پاسخ
================================================= */

function checkAnswer(button,text){

    if(answered) return;

    const q=questions[current];

    if(text===q.answer){

        answered=true;

        clearInterval(timerInterval);

        button.classList.add("correct");

        score+=10+(time);

        correct++;

        badges++;

        document.getElementById("score").innerText=
            score;

        document.getElementById("correct").innerText=
            correct;

        document.getElementById("badges").innerText=
            badges;

        document.getElementById("message").innerText=
            "🎯 عالی! واژه را درست شکار کردی.";

        document.getElementById("message").style.color=
            "#438047";

        disableOptions();

        document.getElementById("next").style.display=
            "block";

    }else{

        button.classList.add("wrong");

        document.getElementById("message").innerText=
            "🔎 این پاسخ درست نیست. دوباره با دقت نگاه کن.";

        document.getElementById("message").style.color=
            "#bd4b3e";

        setTimeout(()=>{
            button.classList.remove("wrong");
        },700);

    }

}


/* =================================================
   نمایش پاسخ صحیح در پایان زمان
================================================= */

function showCorrect(){

    const q=questions[current];

    document.querySelectorAll(".option")
        .forEach(button=>{

            if(button.innerText===q.answer){

                button.classList.add("correct");

            }

            button.disabled=true;

        });

}


/* =================================================
   غیرفعال کردن گزینه‌ها
================================================= */

function disableOptions(){

    document.querySelectorAll(".option")
        .forEach(button=>{

            button.disabled=true;

        });

}


/* =================================================
   صفحه بعد + انیمیشن ورق خوردن
================================================= */

function nextQuestion(){

    clearInterval(timerInterval);

    const page=document.getElementById("page");

    page.classList.remove("turn");

    void page.offsetWidth;

    page.classList.add("turn");

    setTimeout(()=>{

        current++;

        if(current>=questions.length){

            finishGame();

        }else{

            loadQuestion();

        }

    },500);

}


/* =================================================
   پیشرفت
================================================= */

function updateProgress(){

    const percent=
        ((current+1)/questions.length)*100;

    document.getElementById("progress").style.width=
        percent+"%";

}


/* =================================================
   پایان
================================================= */

function finishGame(){

    clearInterval(timerInterval);

    document.querySelector(".notebook").style.display=
        "none";

    document.getElementById("result").style.display=
        "block";

    document.getElementById("finalScore").innerText=
        score;

    document.getElementById("finalCorrect").innerText=
        correct;

    const percent=Math.round(
        (correct/questions.length)*100
    );

    document.getElementById("finalPercent").innerText=
        percent+"%";

    let message="";

    if(percent>=90){

        message=
        "🏆 تو یک استاد واقعی شکار واژه هستی!";

    }else if(percent>=75){

        message=
        "🌟 خیلی عالی بود! دقت واژه‌ای تو بسیار خوب است.";

    }else if(percent>=50){

        message=
        "👏 خوب بود! با کمی تمرین بیشتر حرفه‌ای می‌شوی.";

    }else{

        message=
        "📚 دوباره دفتر را باز کن و تمرین کن؛ موفق می‌شوی.";

    }

    document.getElementById("finalMessage").innerText=
        message;

}


/* =================================================
   شروع دوباره
================================================= */

function restartGame(){

    current=0;
    score=0;
    correct=0;
    badges=0;

    document.getElementById("score").innerText=0;
    document.getElementById("correct").innerText=0;
    document.getElementById("badges").innerText=0;

    document.querySelector(".notebook").style.display=
        "block";

    document.getElementById("result").style.display=
        "none";

    loadQuestion();

}


/* =================================================
   شروع بازی
================================================= */

loadQuestion();

</script>

</html>
