<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شکارچی واژه‌ها 2.2</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        linear-gradient(rgba(9,43,28,.72),rgba(4,24,16,.94)),
        radial-gradient(circle at top,#69a75e,#183d2b 65%,#061a11);
}

.container{
    width:94%;
    max-width:1050px;
    margin:20px auto;
}

.header{
    background:linear-gradient(135deg,#245337,#102f22);
    border:3px solid #82ae68;
    border-radius:30px;
    padding:25px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.header h1{
    margin:0;
    color:#e2f7ad;
    font-size:36px;
    text-shadow:0 3px 7px #000;
}

.header p{
    margin:10px 0 0;
    color:#e8f5dc;
    font-size:17px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:18px 0;
}

.stat{
    min-width:145px;
    padding:10px 20px;
    text-align:center;
    border-radius:18px;
    background:#173d2c;
    border:2px solid #648e56;
    box-shadow:0 6px 15px rgba(0,0,0,.3);
}

.stat strong{
    display:block;
    margin-top:5px;
    font-size:23px;
    color:#e2f7ad;
}

.game{
    background:rgba(12,47,31,.97);
    border:3px solid #638f55;
    border-radius:30px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.level{
    display:inline-block;
    padding:8px 20px;
    border-radius:20px;
    background:#315f40;
    border:2px solid #86b66b;
    color:#e7f8c9;
    font-weight:bold;
}

.instruction{
    font-size:23px;
    font-weight:bold;
    line-height:2;
    margin:20px auto;
    max-width:850px;
}

.story{
    max-width:850px;
    margin:auto;
    padding:15px;
    line-height:2;
    background:rgba(69,106,60,.5);
    border:1px solid #709660;
    border-radius:20px;
}

.image-box{
    font-size:75px;
    margin:15px;
    filter:drop-shadow(0 5px 3px rgba(0,0,0,.5));
}

.target-box{
    max-width:650px;
    margin:15px auto 25px;
    padding:18px;
    border-radius:25px;
    background:#102d20;
    border:3px solid #8cba68;
}

.target-title{
    color:#cce99d;
    font-size:16px;
}

.target{
    margin-top:8px;
    font-size:38px;
    font-weight:bold;
    color:#fff2aa;
}

.word-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    max-width:800px;
    margin:20px auto;
}

.word{
    min-height:75px;
    padding:15px;
    border-radius:20px;
    border:2px solid #6c9c5c;
    background:#29583c;
    color:#fff;
    font-family:Tahoma;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 0 #173526;
    transition:.2s;
}

.word:hover{
    transform:translateY(-4px);
    background:#39724b;
}

.word.correct{
    background:#3d874b;
    border-color:#bce990;
    box-shadow:0 5px 0 #245d31;
}

.word.wrong{
    background:#873f3f;
    border-color:#ed9988;
    box-shadow:0 5px 0 #5a2929;
}

.word:disabled{
    cursor:default;
}

.message{
    min-height:48px;
    margin:15px;
    font-size:20px;
    font-weight:bold;
}

.next{
    display:none;
    border:2px solid #b8dd84;
    background:#4e7d43;
    color:#fff;
    padding:14px 30px;
    border-radius:18px;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #2d5228;
}

.next:hover{
    background:#639b50;
}

.progress-title{
    margin-top:25px;
    color:#d9efbd;
}

.progress{
    height:14px;
    margin-top:7px;
    background:#0b2418;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #537748;
}

.progress-bar{
    width:0;
    height:100%;
    background:linear-gradient(
        90deg,
        #6e9f55,
        #b7d979,
        #e3f7a4
    );
    transition:.5s;
}

.result{
    display:none;
    text-align:center;
    background:#143c29;
    border:3px solid #7eaa63;
    border-radius:30px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.result h2{
    color:#e2f7ad;
}

.final-score{
    font-size:55px;
    font-weight:bold;
    color:#fff1a7;
    margin:15px;
}

.restart{
    border:2px solid #afd57d;
    background:#4d7c42;
    color:#fff;
    padding:15px 30px;
    border-radius:18px;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
}

@media(max-width:650px){

    .header h1{
        font-size:28px;
    }

    .word-grid{
        grid-template-columns:1fr;
    }

    .instruction{
        font-size:19px;
    }

    .word{
        font-size:18px;
    }

    .target{
        font-size:31px;
    }
}
</style>
</head>

/* ==========================================
   متغیرها
========================================== */

let current=0;
let score=0;
let correct=0;
let badges=0;
let energy=5;


/* ==========================================
   نمایش مرحله
========================================== */

function loadLevel(){

    const level=levels[current];

    document.getElementById("stage").innerText=
        current+1;

    document.getElementById("level").innerText=
        level.type;

    document.getElementById("instruction").innerText=
        level.instruction;

    document.getElementById("story").innerText=
        level.story;

    document.getElementById("image").innerText=
        level.image;

    document.getElementById("target").innerText=
        level.target;

    document.getElementById("message").innerText="";

    document.getElementById("next").style.display=
        "none";

    createOptions(level);

    updateProgress();
}


/* ==========================================
   ساخت چهار گزینه
========================================== */

function createOptions(level){

    const grid=
        document.getElementById("wordGrid");

    grid.innerHTML="";

    /*
       دقیقاً چهار گزینه
       و بدون تکرار
    */

    let options=[...level.options];

    options.sort(
        ()=>Math.random()-0.5
    );

    options.forEach(option=>{

        const button=
            document.createElement("button");

        button.className="word";

        button.innerText=option;

        button.onclick=function(){

            checkAnswer(button,option);

        };

        grid.appendChild(button);

    });
}


/* ==========================================
   بررسی پاسخ
========================================== */

function checkAnswer(button,answer){

    const level=levels[current];

    const buttons=
        document.querySelectorAll(".word");


    /* پاسخ صحیح */

    if(answer===level.answer){

        if(button.classList.contains("correct")){
            return;
        }

        button.classList.add("correct");

        buttons.forEach(b=>{
            b.disabled=true;
        });

        score+=10;
        correct++;
        badges++;

        document.getElementById("score").innerText=
            score;

        document.getElementById("badges").innerText=
            badges;

        document.getElementById("message").innerText=
            "🎯 آفرین! واژه هدف را درست شکار کردی.";

        document.getElementById("message").style.color=
            "#dff6a8";

        document.getElementById("next").style.display=
            "inline-block";

    }


    /* پاسخ غلط */

    else{

        if(button.classList.contains("wrong")){
            return;
        }

        button.classList.add("wrong");

        energy--;

        document.getElementById("energy").innerText=
            energy;

        document.getElementById("message").innerText=
            "🔎 این واژه هدف نیست. دوباره با دقت نگاه کن.";

        document.getElementById("message").style.color=
            "#ffb3a7";


        setTimeout(()=>{

            button.classList.remove("wrong");

        },700);


        if(energy<=0){

            document.getElementById("message").innerText=
                "🔦 انرژی کم شده، اما نگران نباش! می‌توانی ادامه بدهی.";

            energy=1;

            document.getElementById("energy").innerText=
                energy;

        }

    }

}


/* ==========================================
   مرحله بعد
========================================== */

function nextStage(){

    current++;

    if(current>=levels.length){

        finishGame();

    }else{

        loadLevel();

    }

}


/* ==========================================
   نوار پیشرفت
========================================== */

function updateProgress(){

    const percent=
        ((current+1)/levels.length)*100;

    document.getElementById("progress").style.width=
        percent+"%";

}


/* ==========================================
   پایان بازی
========================================== */

function finishGame(){

    document.getElementById("game").style.display=
        "none";

    document.getElementById("result").style.display=
        "block";

    document.getElementById("finalScore").innerText=
        score;

    document.getElementById("finalCorrect").innerText=
        correct;

    const percent=
        Math.round(
            correct/levels.length*100
        );

    document.getElementById("finalPercent").innerText=
        percent+"%";


    let message="";

    if(percent>=90){

        message=
        "🏆 استاد شکار واژه‌ها! دقت دیداری فوق‌العاده‌ای داری.";

    }

    else if(percent>=75){

        message=
        "🌟 شکارچی حرفه‌ای! خیلی خوب عمل کردی.";

    }

    else if(percent>=50){

        message=
        "🌿 شکارچی خوب! با تمرین بیشتر مهارتت قوی‌تر می‌شود.";

    }

    else{

        message=
        "🔎 دوباره جنگل را جست‌وجو کن و این بار با دقت بیشتری واژه‌ها را بررسی کن.";

    }

    document.getElementById("finalMessage").innerText=
        message;

}


/* ==========================================
   شروع دوباره
========================================== */

function restartGame(){

    current=0;
    score=0;
    correct=0;
    badges=0;
    energy=5;

    document.getElementById("score").innerText=
        "0";

    document.getElementById("badges").innerText=
        "0";

    document.getElementById("energy").innerText=
        "5";

    document.getElementById("game").style.display=
        "block";

    document.getElementById("result").style.display=
        "none";

    loadLevel();
}


/* شروع بازی */

loadLevel();
