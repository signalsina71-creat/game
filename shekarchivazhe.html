<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
    background:
        linear-gradient(rgba(15,55,35,.70),rgba(5,30,20,.90)),
        radial-gradient(circle at top,#68a75d,#163c29 65%,#071b13);
    color:white;
}

.container{
    width:94%;
    max-width:1050px;
    margin:20px auto;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#214f34,#102f22);
    border:3px solid #78a85f;
    border-radius:30px;
    padding:24px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
}

.header h1{
    margin:0;
    color:#e0f7ad;
    font-size:36px;
    text-shadow:0 3px 8px #000;
}

.header p{
    color:#e5f4d8;
    font-size:17px;
}

/* STATS */

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:18px 0;
}

.stat{
    min-width:145px;
    padding:10px 20px;
    text-align:center;
    border-radius:18px;
    background:#173c2b;
    border:2px solid #628c54;
    box-shadow:0 6px 15px rgba(0,0,0,.3);
}

.stat strong{
    display:block;
    margin-top:5px;
    font-size:23px;
    color:#e0f7ad;
}

/* GAME */

.game{
    background:rgba(13,48,32,.96);
    border:3px solid #628f55;
    border-radius:30px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.level{
    display:inline-block;
    padding:8px 20px;
    border-radius:20px;
    background:#315d3d;
    border:2px solid #83b66c;
    color:#e5f8c8;
    font-weight:bold;
}

.instruction{
    font-size:22px;
    font-weight:bold;
    margin:20px auto;
    line-height:2;
    max-width:850px;
}

.story{
    background:rgba(68,104,59,.5);
    border:1px solid #70945e;
    border-radius:20px;
    padding:15px;
    max-width:850px;
    margin:auto;
    line-height:2;
}

/* TARGET */

.target-box{
    margin:20px auto;
    max-width:650px;
    background:#102d20;
    border:3px solid #8ebd68;
    border-radius:25px;
    padding:20px;
}

.target-title{
    color:#cce99e;
    font-size:17px;
}

.target{
    font-size:38px;
    font-weight:bold;
    color:#fff4b5;
    margin-top:10px;
}

/* WORD GRID */

.word-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    max-width:850px;
    margin:25px auto;
}

.word{
    min-height:70px;
    border-radius:18px;
    border:2px solid #67985a;
    background:#28563a;
    color:#f5f8e9;
    font-family:Tahoma;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 5px 0 #173525;
}

.word:hover{
    transform:translateY(-4px) scale(1.02);
    background:#376e49;
}

.word.correct{
    background:#3e874b;
    border-color:#b8e986;
    box-shadow:0 5px 0 #275d32;
}

.word.wrong{
    background:#843f3f;
    border-color:#e69383;
    box-shadow:0 5px 0 #592929;
}

/* IMAGE */

.image-box{
    font-size:85px;
    padding:15px;
}

/* MESSAGE */

.message{
    min-height:45px;
    margin:15px;
    font-size:20px;
    font-weight:bold;

/* NEXT */

.next{
    display:none;
    border:2px solid #b5db83;
    background:#4d7c42;
    color:white;

    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #2c5028;
}

.next:hover{

/* PROGRESS */

.progress-title{
    margin-top:25px;
    color:#d8efbd;
}

.progress{
    height:14px;
    background:#0c2419;
    border-radius:20px;

    border:1px solid #537748;
    margin-top:7px;

.progress-bar{
    width:0;
    height:100%;
    background:linear-gradient(
        90deg,
        #6d9e53,
        #b3d876,
        #e2f6a2

/* RESULT */

.result{
    display:none;
    text-align:center;
    background:#143b29;
    border:3px solid #79a961;
    border-radius:30px;
    padding:35px;

.result h2{

}

.final-score{

.restart{
    border:2px solid #afd27c;
    background:#4d7c42;
    color:white;
    padding:15px 30px;
    border-radius:18px;
    font-family:Tahoma;
    font-size:18px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

    .header h1{

    }

    .word-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .instruction{

    }

    .word{

    }

/* ===================================
   متغیرها
=================================== */

let current=0;
let score=0;
let correct=0;
let badges=0;
let energy=5;


/* ===================================
   نمایش مرحله
=================================== */

function loadLevel(){

    const level=levels[current];

    document.getElementById("stage").innerText=current+1;

    document.getElementById("level").innerText=
        "🌿 "+level.type+
        " | مرحله "+(current+1);

    document.getElementById("instruction").innerText=
        level.instruction;

    document.getElementById("story").innerText=
        level.story;

    document.getElementById("image").innerText=
        level.image;

    document.getElementById("target").innerText=
        level.target;

    document.getElementById("message").innerText="";

    document.getElementById("next").style.display=
        "none";

    createWords(level);

    updateProgress();

}


/* ===================================
   ساخت واژه‌ها
=================================== */

function createWords(level){

    const grid=
        document.getElementById("wordGrid");

    grid.innerHTML="";

    let words=[...level.words];

    words.sort(
        ()=>Math.random()-0.5
    );

    words.forEach(word=>{

        const button=
            document.createElement("button");

        button.className="word";

        button.innerText=word;

        button.onclick=()=>{

            selectWord(button,word);

        };

        grid.appendChild(button);

    });

}


/* ===================================
   انتخاب واژه
=================================== */

function selectWord(button,word){

    const level=levels[current];

    const buttons=
        document.querySelectorAll(".word");

    if(word===level.target){

        if(button.classList.contains("correct")){
            return;
        }

        button.classList.add("correct");

        score+=10;

        correct++;

        badges++;

        document.getElementById("score")
            .innerText=score;

        document.getElementById("badges")
            .innerText=badges;

        document.getElementById("message")
            .innerText=
            "🎯 آفرین! واژه هدف را شکار کردی.";

        document.getElementById("message")
            .style.color="#dff6a8";

        /*
        در این نسخه برای جلوگیری از سخت شدن
        بیش از حد بازی، با اولین واژه صحیح
        مرحله تمام می‌شود.
        */

        buttons.forEach(b=>{
            b.disabled=true;
        });

        document.getElementById("next")
            .style.display="inline-block";

    }

    else{

        button.classList.add("wrong");

        energy--;

        document.getElementById("energy")
            .innerText=energy;

        document.getElementById("message")
            .innerText=
            "🔎 این واژه نیست. دوباره دقت کن!";

        document.getElementById("message")
            .style.color="#ffb3a7";

        setTimeout(()=>{

            button.classList.remove("wrong");

        },700);


        if(energy<=0){

            document.getElementById("message")
                .innerText=
                "🔦 انرژی جست‌وجو تمام شد، اما می‌توانی ادامه بدهی.";

            energy=1;

            document.getElementById("energy")
                .innerText=energy;

        }

    }

}


/* ===================================
   مرحله بعد
=================================== */

function nextStage(){

    current++;

    if(current>=levels.length){

        finishGame();

    }else{

        loadLevel();

    }

}


/* ===================================
   پیشرفت
=================================== */

function updateProgress(){

    const percent=
        ((current+1)/levels.length)*100;

    document.getElementById("progress")
        .style.width=
        percent+"%";

}


/* ===================================
   پایان
=================================== */

    document.getElementById("result")

        .innerText=score;

    document.getElementById("finalCorrect")

    const percent=
        Math.round(
            correct/levels.length*100
        );

    document.getElementById("finalPercent")
        .innerText=percent+"%";


    let message="";

    if(percent>=90){

        message=
        "🏆 استاد شکار واژه‌ها! فوق‌العاده عمل کردی.";

    }

    else if(percent>=75){

        message=
        "🌟 شکارچی حرفه‌ای! دقتت بسیار خوب است.";

    }

    else if(percent>=50){

        message=
        "🌿 شکارچی خوب! با تمرین بیشتر بهتر می‌شوی.";

    }

    else{

        message=
        "🔎 دوباره جنگل را جست‌وجو کن و مهارتت را بیشتر کن.";

    }

    document.getElementById("finalMessage")
        .innerText=message;

}


/* ===================================
   شروع دوباره
=================================== */

function restartGame(){

    current=0;

    score=0;

    correct=0;

    badges=0;

    energy=5;

    document.getElementById("score")
        .innerText=0;

    document.getElementById("badges")
        .innerText=0;

    document.getElementById("energy")
        .innerText=5;

    document.getElementById("game")
        .style.display="block";

    document.getElementById("result")
        .style.display="none";

    loadLevel();

}


/* شروع بازی */

loadLevel();

</script>
