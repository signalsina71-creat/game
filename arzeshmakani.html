<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>شهر ارزش مکانی</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:#fff;

    background:
    radial-gradient(
        circle at 20% 10%,
        #40306b 0,
        transparent 28%
    ),
    radial-gradient(
        circle at 80% 20%,
        #154f65 0,
        transparent 25%
    ),
    linear-gradient(
        180deg,
        #080b20,
        #11152e 55%,
        #090c1c
    );
}


/* =========================
   GAME
========================= */

.game{
    width:96%;
    max-width:1200px;
    margin:auto;
    padding:15px 0 30px;
}


/* =========================
   HEADER
========================= */

.header{

    position:relative;

    padding:18px 20px;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        #191d42,
        #27204b
    );

    border:2px solid #514a91;

    box-shadow:
    0 15px 40px #0008,
    inset 0 1px #ffffff22;

    text-align:center;

    overflow:hidden;
}

.header:before{

    content:"";

    position:absolute;

    width:250px;
    height:250px;

    background:#5e55d422;

    border-radius:50%;

    top:-180px;
    right:-70px;
}

.header h1{

    position:relative;

    margin:0;

    font-size:36px;

    color:#ffe27a;

    text-shadow:
    0 0 10px #ffdc5c77,
    0 3px 0 #171329;
}

.header p{

    position:relative;

    margin:7px 0 0;

    color:#c9d4ff;

}


/* =========================
   STATS
========================= */

.stats{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;

    margin:15px 0;
}

.stat{

    min-width:135px;

    padding:9px 15px;

    border-radius:17px;

    background:
    linear-gradient(
        145deg,
        #191d3d,
        #25284c
    );

    border:1px solid #555b91;

    box-shadow:
    0 7px 15px #0005,
    inset 0 1px #ffffff16;

    text-align:center;

    color:#aeb8ef;
}

.stat strong{

    display:block;

    margin-top:3px;

    font-size:21px;

    color:#ffe27a;
}


/* =========================
   CITY
========================= */

.city{

    position:relative;

    min-height:700px;

    overflow:hidden;

    border-radius:30px;

    border:2px solid #414875;

    background:

    radial-gradient(
        circle at 50% 10%,
        #313d72,
        transparent 35%
    ),

    linear-gradient(
        180deg,
        #10152f 0%,
        #111832 45%,
        #080b1c 100%
    );

    box-shadow:
    0 25px 60px #0009,
    inset 0 0 80px #0007;
}


/* stars */

.star{

    position:absolute;

    width:3px;
    height:3px;

    background:#fff;

    border-radius:50%;

    opacity:.7;

    animation:
    twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.25;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.4);
    }
}


/* =========================
   BUILDINGS
========================= */

.buildings{

    position:absolute;

    bottom:150px;

    left:0;
    right:0;

    height:260px;

    display:flex;

    align-items:end;

    justify-content:center;

    gap:10px;

    opacity:.75;
}

.building{

    position:relative;

    width:75px;

    border-radius:
    8px 8px 0 0;

    background:
    linear-gradient(
        90deg,
        #171b3c,
        #30375d,
        #12162f
    );

    border:
    1px solid #56608e;

    box-shadow:
    8px 0 15px #0005;
}

.building:after{

    content:"";

    position:absolute;

    top:15px;
    left:10px;
    right:10px;

    height:160px;

    background:
    repeating-linear-gradient(
        to bottom,
        #f5d56c 0 7px,
        transparent 8px 25px
    );

    opacity:.5;
}

.b1{height:130px}
.b2{height:190px}
.b3{height:155px}
.b4{height:230px}
.b5{height:170px}
.b6{height:210px}
.b7{height:145px}


/* =========================
   QUESTION PANEL
========================= */

.panel{

    position:relative;

    z-index:5;

    width:88%;

    max-width:850px;

    margin:35px auto;

    padding:25px;

    border-radius:28px;

    background:
    linear-gradient(
        145deg,
        #242750eF,
        #171b3feF
    );

    border:
    2px solid #5a64a3;

    box-shadow:
    0 25px 45px #0008,
    inset 0 1px #ffffff18;

    text-align:center;

    backdrop-filter:blur(7px);
}


/* =========================
   LEVEL
========================= */

.level{

    display:inline-block;

    padding:7px 18px;

    border-radius:20px;

    background:#3b3672;

    color:#bfcaff;

    font-size:15px;

    margin-bottom:10px;
}


/* =========================
   QUESTION
========================= */

.question{

    font-size:24px;

    line-height:2;

    color:#fff;

    margin:10px;
}

.number-big{

    display:inline-block;

    padding:10px 22px;

    margin:8px;

    border-radius:16px;

    background:
    linear-gradient(
        145deg,
        #ffd965,
        #b67c22
    );

    color:#171328;

    font-size:34px;

    font-weight:bold;

    box-shadow:
    0 7px 0 #76501d,
    0 10px 25px #0006;
}


/* =========================
   WATER TIMER
========================= */

.timer-area{

    position:absolute;

    top:20px;

    left:20px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:5px;
}

.tank{

    position:relative;

    width:60px;

    height:100px;

    border:4px solid #91c9dc;

    border-radius:
    12px 12px 18px 18px;

    background:#10243a;

    overflow:hidden;

    box-shadow:
    0 0 15px #54d5ff44,
    inset 0 0 10px #0008;

    transition:.3s;
}

.tank:before{

    content:"";

    position:absolute;

    left:10px;
    right:10px;

    top:4px;

    height:5px;

    border-radius:5px;

    background:#d9f6ff;
}

.water{

    position:absolute;

    bottom:0;

    left:0;
    right:0;

    height:100%;

    background:
    linear-gradient(
        180deg,
        #64ddff,
        #1676ba
    );

    transition:
    height .8s linear;

    box-shadow:
    inset 0 5px 8px #ffffff44;
}

.water:before{

    content:"";

    position:absolute;

    top:0;

    left:-20%;

    width:140%;

    height:12px;

    background:#a5eeff66;

    border-radius:50%;

    animation:
    wave 2s infinite linear;
}

@keyframes wave{

    from{
        transform:translateX(-20%);
    }

    to{
        transform:translateX(20%);
    }
}

.timer-text{

    color:#d9f6ff;

    font-weight:bold;

    font-size:16px;
}

.tank.warning{

    animation:
    shake .15s infinite alternate;

    border-color:#ff6d73;

    box-shadow:
    0 0 20px #ff4e5555;
}

.tank.warning .water{

    background:
    linear-gradient(
        180deg,
        #ff8b68,
        #d93453
    );
}

@keyframes shake{

    from{
        transform:rotate(-3deg);
    }

    to{
        transform:rotate(3deg);
    }
}


/* =========================
   CAT
========================= */

.cat{

    position:absolute;

    bottom:135px;

    right:-180px;

    width:150px;

    height:170px;

    z-index:10;

    transition:
    right .8s cubic-bezier(.2,.8,.2,1);

    filter:
    drop-shadow(0 12px 10px #0008);
}

.cat.show{

    right:20px;
}

.cat-body{

    position:absolute;

    bottom:0;

    left:30px;

    width:90px;

    height:90px;

    border-radius:
    50% 50% 45% 45%;

    background:
    linear-gradient(
        145deg,
        #f0b17d,
        #bd714f
    );

    border:3px solid #673e3c;
}

.cat-head{

    position:absolute;

    top:20px;

    left:28px;

    width:95px;

    height:85px;

    border-radius:
    45% 45% 42% 42%;

    background:
    linear-gradient(
        145deg,
        #f4c18b,
        #bd714f
    );

    border:3px solid #673e3c;
}

.ear{

    position:absolute;

    width:35px;
    height:35px;

    top:0;

    background:#d99069;

    border:
    3px solid #673e3c;

    transform:rotate(45deg);

    z-index:-1;
}

.ear.left{
    left:3px;
}

.ear.right{
    right:3px;
}

.eye{

    position:absolute;

    top:32px;

    width:10px;
    height:13px;

    border-radius:50%;

    background:#1a1830;
}

.eye.left{
    left:23px;
}

.eye.right{
    right:23px;
}

.nose{

    position:absolute;

    top:49px;

    left:42px;

    width:12px;
    height:9px;

    background:#8f3e52;

    border-radius:50%;
}

.mouth{

    position:absolute;

    top:58px;

    left:34px;

    width:28px;

    height:15px;

    border-bottom:
    3px solid #5c3232;

    border-radius:50%;
}

.paw{

    position:absolute;

    width:35px;
    height:65px;

    background:#d99069;

    border-radius:20px;

    bottom:45px;

    border:3px solid #673e3c;

    transform-origin:bottom center;
}

.paw.left{

    left:15px;

    transform:rotate(20deg);
}

.paw.right{

    right:0;

    transform:rotate(-25deg);
}

.cat.happy .paw.right{

    animation:
    wavepaw .45s infinite alternate;
}

@keyframes wavepaw{

    from{
        transform:rotate(-25deg);
    }

    to{
        transform:rotate(-55deg);
    }
}

.cat.angry .eye{

    height:4px;

    transform:
    rotate(12deg);
}

.cat.angry .mouth{

    border-bottom:0;

    border-top:
    3px solid #5c3232;

}

.cat.angry{

    animation:
    angrycat .25s infinite alternate;
}

@keyframes angrycat{

    from{
        transform:translateX(-2px);
    }

    to{
        transform:translateX(3px);
    }
}


/* =========================
   OPTIONS
========================= */

.options{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:14px;

    margin-top:20px;
}

.option{

    min-height:65px;

    border-radius:18px;

    border:
    2px solid #59639c;

    background:
    linear-gradient(
        145deg,
        #292e5a,
        #1b2044
    );

    color:#fff;

    font-family:Tahoma;

    font-size:19px;

    cursor:pointer;

    box-shadow:
    0 6px 0 #101329,
    0 10px 18px #0004;

    transition:.2s;
}

.option:hover{

    transform:
    translateY(-4px)
    scale(1.01);

    border-color:#ffe17a;

    box-shadow:
    0 8px 0 #101329,
    0 0 20px #ffe17a33;
}

.option.correct{

    background:
    linear-gradient(
        145deg,
        #2d805e,
        #18533f
    );

    border-color:#65e4b1;

    box-shadow:
    0 6px 0 #103c2e,
    0 0 25px #55e5ac55;
}

.option.wrong{

    background:
    linear-gradient(
        145deg,
        #913f56,
        #5b263a
    );

    border-color:#ff7a86;

    animation:
    wrong .25s;
}

@keyframes wrong{

    25%{
        transform:translateX(7px);
    }

    50%{
        transform:translateX(-7px);
    }

    75%{
        transform:translateX(5px);
    }
}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:35px;

    margin-top:15px;

    font-size:18px;

    font-weight:bold;

    color:#c9d4ff;
}


/* =========================
   NEXT
========================= */

.next{

    display:none;

    margin:10px auto;

    padding:12px 30px;

    border:0;

    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        #e7b84d,
        #a9701e
    );

    color:#171328;

    font-family:Tahoma;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 6px 0 #704919,
    0 0 20px #e4b64c33;
}


/* =========================
   MOVING NUMBERS
========================= */

.number-road{

    position:absolute;

    bottom:0;

    left:0;

    right:0;

    height:120px;

    overflow:hidden;

    background:
    linear-gradient(
        180deg,
        transparent,
        #050714
    );

    border-top:
    2px solid #242b52;
}

.moving-number{

    position:absolute;

    bottom:15px;

    font-size:35px;

    font-weight:bold;

    color:#6d79b7;

    text-shadow:
    0 0 10px #6576e555;

    animation:
    moveNumber linear infinite;

    opacity:.65;
}

@keyframes moveNumber{

    from{
        transform:
        translateX(120vw)
        rotate(-5deg);
    }

    to{
        transform:
        translateX(-150px)
        rotate(5deg);
    }
}


/* =========================
   PROGRESS
========================= */

.progress{

    width:80%;

    height:12px;

    margin:18px auto;

    background:#10142d;

    border:
    1px solid #454d7d;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{

    width:0;

    height:100%;

    background:
    linear-gradient(
        90deg,
        #54dfb2,
        #ffe16b
    );

    transition:.5s;
}


/* =========================
   RESULT
========================= */

.result{

    display:none;

    padding:50px 25px;

    text-align:center;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        #242750,
        #14182f
    );

    border:
    2px solid #626ba9;

    box-shadow:
    0 25px 50px #0009;
}

.result h2{

    color:#ffe27a;

    font-size:32px;
}

.final-score{

    font-size:70px;

    font-weight:bold;

    color:#ffe27a;

    text-shadow:
    0 0 25px #ffe27a55;
}

.restart{

    border:0;

    padding:15px 35px;

    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        #55c9a1,
        #2c8066
    );

    color:white;

    font-family:Tahoma;

    font-size:18px;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header h1{
        font-size:27px;
    }

    .city{
        min-height:760px;
    }

    .panel{
        width:94%;
        padding:18px;
        margin-top:45px;
    }

    .timer-area{
        position:relative;
        top:auto;
        left:auto;
        flex-direction:row;
        justify-content:center;
        margin-bottom:10px;
    }

    .tank{
        width:50px;
        height:80px;
    }

    .question{
        font-size:19px;
    }

    .number-big{
        font-size:28px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .buildings{
        transform:scale(.75);
        transform-origin:bottom center;
    }

    .cat{
        transform:scale(.8);
        transform-origin:bottom right;
    }

    .cat.show{
        right:-5px;
    }
}

</style>
</head>


<body>


<div class="game">


<!-- HEADER -->

<div class="header">

<h1>
🏙️ شهر ارزش مکانی
</h1>

<p>
در شهر اعداد، هر رقم خانه مخصوص خودش را دارد!
</p>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
🪙 سکه
<strong id="score">0</strong>
</div>

<div class="stat">
🔥 زنجیره
<strong id="streak">0</strong>
</div>

<div class="stat">
📍 مرحله
<strong id="stage">1</strong>
</div>

<div class="stat">
🎯 پاسخ درست
<strong id="correct">0</strong>
</div>

</div>


<!-- CITY -->

<div class="city" id="city">


<!-- STARS -->

<div class="star" style="top:8%;left:8%"></div>
<div class="star" style="top:16%;left:23%"></div>
<div class="star" style="top:9%;left:40%"></div>
<div class="star" style="top:20%;left:60%"></div>
<div class="star" style="top:11%;left:78%"></div>
<div class="star" style="top:25%;left:90%"></div>
<div class="star" style="top:32%;left:13%"></div>
<div class="star" style="top:28%;left:48%"></div>
<div class="star" style="top:37%;left:73%"></div>


<!-- BUILDINGS -->

<div class="buildings">

<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>

</div>


<!-- CAT -->

<div class="cat" id="cat">

<div class="cat-head">

<div class="ear left"></div>
<div class="ear right"></div>

<div class="eye left"></div>
<div class="eye right"></div>

<div class="nose"></div>
<div class="mouth"></div>

</div>

<div class="cat-body"></div>

<div class="paw left"></div>
<div class="paw right"></div>

</div>


<!-- QUESTION PANEL -->

<div class="panel">


<div class="timer-area">

<div class="tank" id="tank">

<div class="water" id="water"></div>

</div>

<div class="timer-text">

⏱️
<span id="timer">30</span>

</div>

</div>


<div class="level" id="level">
مرحله ۱ | خانه‌های شهر
</div>


<div class="question" id="question">

</div>


<div class="options" id="options"></div>


<div class="message" id="message"></div>


<button class="next"
id="next"
onclick="nextQuestion()">

🏙️ ورود به بخش بعدی شهر

</button>


<div class="progress">

<div class="progress-bar"
id="progress">
</div>

</div>

</div>


<!-- MOVING NUMBERS -->

<div class="number-road"
id="numberRoad">
</div>


</div>


<!-- RESULT -->

<div class="result"
id="result">

<h2>
🏆 شهروند افتخاری شهر اعداد!
</h2>

<p>
تو تمام مأموریت‌های شهر ارزش مکانی را پشت سر گذاشتی.
</p>

<div class="final-score"
id="finalScore">
0
</div>

<p>
پاسخ‌های درست:
<strong id="finalCorrect">0</strong>
از
<strong>15</strong>
</p>

<p>
درصد موفقیت:
<strong id="finalPercent">0%</strong>
</p>

<h3 id="finalMessage"></h3>

<button
class="restart"
onclick="restartGame()">

🔄 دوباره بازی کن

</button>

</div>


</div>


<script>


/* =====================================
   QUESTIONS
===================================== */

const questions=[

/* مرحله ۱ */

{
level:"مرحله ۱ | آشنایی با خانه‌ها",
q:"در عدد ۴۵۶، رقم ۶ در کدام خانه قرار دارد؟",
options:["یکان","دهگان","صدگان","هزارگان"],
answer:"یکان"
},

{
level:"مرحله ۱ | آشنایی با خانه‌ها",
q:"در عدد ۷۸۲، رقم ۸ در کدام خانه است؟",
options:["یکان","دهگان","صدگان","هزارگان"],
answer:"دهگان"
},

{
level:"مرحله ۱ | آشنایی با خانه‌ها",
q:"در عدد ۳۲۵، رقم ۳ چه ارزشی دارد؟",
options:["۳","۳۰","۳۰۰","۳۰۰۰"],
answer:"۳۰۰"
},


/* مرحله ۲ */

{
level:"مرحله ۲ | ارزش رقم",
q:"ارزش رقم ۵ در عدد ۵۴۲ چیست؟",
options:["۵","۵۰","۵۰۰","۵۰۰۰"],
answer:"۵۰۰"
},

{
level:"مرحله ۲ | ارزش رقم",
q:"ارزش رقم ۷ در عدد ۲۷۶ چیست؟",
options:["۷","۷۰","۷۰۰","۷۰۰۰"],
answer:"۷۰"
},

{
level:"مرحله ۲ | ارزش رقم",
q:"در عدد ۸۴۳، ارزش رقم ۳ چند است؟",
options:["۳","۳۰","۳۰۰","۸۳"],
answer:"۳"
},


/* مرحله ۳ */

{
level:"مرحله ۳ | ساخت عدد",
q:"با رقم‌های ۳، ۵ و ۸، کدام عدد ساخته می‌شود؟",
options:["۳۵۸","۵۳۸","۸۳۵","همه موارد"],
answer:"همه موارد"
},

{
level:"مرحله ۳ | ساخت عدد",
q:"کدام عدد بزرگ‌تر است؟",
options:["۴۵۶","۴۶۵","۴۵۹","۴۵۰"],
answer:"۴۶۵"
},

{
level:"مرحله ۳ | ساخت عدد",
q:"کدام عدد کوچک‌تر است؟",
options:["۷۸۹","۷۹۸","۷۷۹","۷۸۰"],
answer:"۷۷۹"
},


/* مرحله ۴ */

{
level:"مرحله ۴ | مقایسه عددها",
q:"کدام رابطه درست است؟",
options:[
"۴۵۶ > ۴۶۵",
"۵۶۷ > ۵۶۶",
"۳۴۵ < ۳۴۰",
"۷۸۰ < ۷۷۹"
],
answer:"۵۶۷ > ۵۶۶"
},

{
level:"مرحله ۴ | مقایسه عددها",
q:"عدد ۶۰۰ + ۴۰ + ۵ کدام است؟",
options:["۶۴۵","۶۰۴۵","۶۵۴","۶۰۵"],
answer:"۶۴۵"
},

{
level:"مرحله ۴ | مقایسه عددها",
q:"عدد ۸۰۰ + ۷۰ + ۲ کدام است؟",
options:["۸۷۲","۸۰۷۲","۸۲۷","۸۷۰"],
answer:"۸۷۲"
},


/* مرحله ۵ */

{
level:"مرحله ۵ | مأموریت نهایی",
q:"در عدد ۹۸۷، رقم ۹ چه ارزشی دارد؟",
options:["۹","۹۰","۹۰۰","۹۰۰۰"],
answer:"۹۰۰"
},

{
level:"مرحله ۵ | مأموریت نهایی",
q:"کدام عدد از همه بزرگ‌تر است؟",
options:["۹۸۷","۹۷۸","۸۹۷","۹۸۹"],
answer:"۹۸۹"
},

{
level:"مرحله ۵ | مأموریت نهایی",
q:"عدد ۷۰۰ + ۲۰ + ۶ را پیدا کن.",
options:["۷۲۶","۷۶۲","۷۰۲۶","۷۲۰"],
answer:"۷۲۶"
}

];


/* =====================================
   VARIABLES
===================================== */

let current=0;

let score=0;

let correct=0;

let streak=0;

let time=30;

let timerInterval=null;

let answered=false;


/* =====================================
   MOVING NUMBERS
===================================== */

function createMovingNumbers(){

    const road=
    document.getElementById("numberRoad");

    road.innerHTML="";

    const nums=[
        "۳",
        "۷",
        "۵",
        "۲",
        "۹",
        "۴",
        "۱",
        "۸",
        "۶",
        "۰",
        "۳۵",
        "۷۲",
        "۴۸",
        "۹۱"
    ];

    nums.forEach((num,i)=>{

        const el=
        document.createElement("div");

        el.className="moving-number";

        el.innerText=num;

        el.style.left=
        (-100-i*70)+"px";

        el.style.animationDuration=
        (12+i%6)+"s";

        el.style.animationDelay=
        (-i*1.4)+"s";

        el.style.fontSize=
        (25+(i%4)*8)+"px";

        road.appendChild(el);

    });

}


/* =====================================
   LOAD QUESTION
===================================== */

function loadQuestion(){

    clearInterval(timerInterval);

    answered=false;

    time=30;

    const q=
    questions[current];


    document.getElementById("stage")
    .innerText=current+1;


    document.getElementById("level")
    .innerText=q.level;


    document.getElementById("question")
    .innerHTML=
    q.q;


    document.getElementById("message")
    .innerText="";


    document.getElementById("next")
    .style.display="none";


    document.getElementById("timer")
    .innerText="30";


    document.getElementById("tank")
    .classList.remove("warning");


    document.getElementById("water")
    .style.height="100%";


    document.getElementById("cat")
    .className="cat";


    createOptions(q);

    updateProgress();

    startTimer();

}


/* =====================================
   OPTIONS
===================================== */

function createOptions(q){

    const area=
    document.getElementById("options");

    area.innerHTML="";


    let opts=
    [...q.options];

    opts.sort(
        ()=>Math.random()-.5
    );


    opts.forEach(text=>{

        const btn=
        document.createElement("button");

        btn.className="option";

        btn.innerText=text;

        btn.onclick=()=>{

            checkAnswer(btn,text);

        };

        area.appendChild(btn);

    });

}


/* =====================================
   TIMER
===================================== */

function startTimer(){

    timerInterval=
    setInterval(()=>{

        time--;


        document.getElementById("timer")
        .innerText=time;


        document.getElementById("water")
        .style.height=
        (time/30*100)+"%";


        if(time<=10){

            document.getElementById("tank")
            .classList.add("warning");

        }


        if(time<=0){

            clearInterval(timerInterval);

            if(!answered){

                answered=true;

                streak=0;

                document.getElementById("streak")
                .innerText=streak;

                document.getElementById("message")
                .innerText=
                "⏰ آب مخزن تمام شد! پاسخ درست را ببین و دوباره تلاش کن.";

                document.getElementById("message")
                .style.color="#ff8990";

                showCorrect();

                showCat(false);

                document.getElementById("next")
                .style.display="block";

            }

        }

    },1000);

}


/* =====================================
   CHECK
===================================== */

function checkAnswer(button,text){

    if(answered)return;


    const q=
    questions[current];


    if(text===q.answer){

        answered=true;

        clearInterval(timerInterval);

        button.classList.add("correct");


        correct++;

        streak++;


        let points=
        20+(time*2)+(streak*5);


        score+=points;


        document.getElementById("score")
        .innerText=score;


        document.getElementById("correct")
        .innerText=correct;


        document.getElementById("streak")
        .innerText=streak;


        document.getElementById("message")
        .innerText=
        "🐱 آفرین! گربه شهر اعداد از پاسخ تو خوشحال شد. +"+
        points+
        " سکه";


        document.getElementById("message")
        .style.color="#68e0b2";


        showCat(true);

        disableOptions();


        document.getElementById("next")
        .style.display="block";

    }


    else{

        button.classList.add("wrong");


        streak=0;


        document.getElementById("streak")
        .innerText=streak;


        document.getElementById("message")
        .innerText=
        "😾 اوه! گربه عصبانی شد. دوباره با دقت فکر کن.";


        document.getElementById("message")
        .style.color="#ff8990";


        showCat(false);


        setTimeout(()=>{

            button.classList.remove("wrong");

        },500);

    }

}


/* =====================================
   CAT
===================================== */

function showCat(happy){

    const cat=
    document.getElementById("cat");

    cat.className=
    "cat show "+
    (happy ? "happy":"angry");

}


/* =====================================
   SHOW CORRECT
===================================== */

function showCorrect(){

    const answer=
    questions[current].answer;


    document
    .querySelectorAll(".option")
    .forEach(btn=>{

        if(btn.innerText===answer){

            btn.classList.add("correct");

        }

        btn.disabled=true;

    });

}


/* =====================================
   DISABLE
===================================== */

function disableOptions(){

    document
    .querySelectorAll(".option")
    .forEach(btn=>{

        btn.disabled=true;

    });

}


/* =====================================
   NEXT
===================================== */

function nextQuestion(){

    clearInterval(timerInterval);


    current++;


    if(current>=questions.length){

        finishGame();

        return;

    }


    loadQuestion();

}


/* =====================================
   PROGRESS
===================================== */

function updateProgress(){

    const percent=
    ((current+1)/
    questions.length)*100;


    document.getElementById("progress")
    .style.width=
    percent+"%";

}


/* =====================================
   FINISH
===================================== */

function finishGame(){

    clearInterval(timerInterval);


    document.getElementById("city")
    .style.display="none";


    document.getElementById("result")
    .style.display="block";


    document.getElementById("finalScore")
    .innerText=score;


    document.getElementById("finalCorrect")
    .innerText=correct;


    const percent=
    Math.round(
        correct/
        questions.length*
        100
    );


    document.getElementById("finalPercent")
    .innerText=
    percent+"%";


    let msg;


    if(percent>=90){

        msg=
        "🏆 فوق‌العاده! تو استاد ارزش مکانی هستی.";

    }

    else if(percent>=75){

        msg=
        "🌟 عالی بود! شهر اعداد به تو افتخار می‌کند.";

    }

    else if(percent>=50){

        msg=
        "👏 خوب بود! با کمی تمرین بهتر هم می‌شوی.";

    }

    else{

        msg=
        "📚 دوباره به شهر اعداد برگرد و تمرین کن.";

    }


    document.getElementById("finalMessage")
    .innerText=msg;

}


/* =====================================
   RESTART
===================================== */

function restartGame(){

    current=0;

    score=0;

    correct=0;

    streak=0;


    document.getElementById("score")
    .innerText=0;

    document.getElementById("correct")
    .innerText=0;

    document.getElementById("streak")
    .innerText=0;


    document.getElementById("city")
    .style.display="block";


    document.getElementById("result")
    .style.display="none";


    loadQuestion();

}


/* =====================================
   START
===================================== */

createMovingNumbers();

loadQuestion();

</script>
