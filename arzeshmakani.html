<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>شهر ارزش مکانی 2</title>

<style>
*{box-sizing:border-box;user-select:none}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
color:#fff;
background:
radial-gradient(circle at 20% 10%,#433b73 0,transparent 25%),
radial-gradient(circle at 85% 20%,#14566b 0,transparent 25%),
linear-gradient(#070b20,#111936,#060914);
min-height:100vh;
}

.game{
width:96%;
max-width:1200px;
margin:auto;
padding:12px 0 30px;
}

header{
text-align:center;
padding:18px;
border-radius:25px;
background:linear-gradient(145deg,#1c2247,#29234c);
border:2px solid #58629a;
box-shadow:0 15px 40px #0008;
}

header h1{
margin:0;
font-size:32px;
color:#ffe27a;
}

header p{
margin:8px 0 0;
color:#c9d3fa;
}

.stats{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:14px 0;
}

.stat{
min-width:125px;
padding:8px 14px;
border-radius:17px;
background:linear-gradient(145deg,#191e3f,#292d54);
border:1px solid #596293;
text-align:center;
}

.stat strong{
display:block;
font-size:20px;
color:#ffe27a;
}

.city{
position:relative;
min-height:760px;
overflow:hidden;
border-radius:30px;
background:
radial-gradient(circle at 50% 15%,#35477b,transparent 30%),
linear-gradient(#111735,#0e1530 55%,#070b1d);
border:2px solid #48527f;
box-shadow:0 25px 60px #0009;
}

.star{
position:absolute;
width:3px;
height:3px;
background:#fff;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2}
to{opacity:1}
}

.buildings{
position:absolute;
bottom:145px;
left:0;
right:0;
height:250px;
display:flex;
justify-content:center;
align-items:end;
gap:9px;
opacity:.65;
}

.building{
width:70px;
background:linear-gradient(90deg,#151a39,#333b62,#12162f);
border:1px solid #56608b;
border-radius:7px 7px 0 0;
position:relative;
}

.building:after{
content:"";
position:absolute;
top:15px;
left:10px;
right:10px;
bottom:10px;
background:repeating-linear-gradient(
to bottom,#f5d56b 0 7px,transparent 8px 25px);
opacity:.4;
}

.b1{height:120px}
.b2{height:180px}
.b3{height:145px}
.b4{height:220px}
.b5{height:165px}
.b6{height:200px}
.b7{height:140px}

.panel{
position:relative;
z-index:5;
width:94%;
max-width:1000px;
margin:25px auto;
padding:22px;
border-radius:28px;
background:#202546eF;
border:2px solid #5b65a0;
box-shadow:0 25px 45px #0009;
backdrop-filter:blur(7px);
text-align:center;
}

.timer-area{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
}

.tank{
width:55px;
height:90px;
position:relative;
overflow:hidden;
border:4px solid #9bd5e6;
border-radius:12px 12px 18px 18px;
background:#11253b;
}

.water{
position:absolute;
bottom:0;
left:0;
right:0;
height:100%;
background:linear-gradient(#66e1ff,#1974b8);
transition:height .8s linear;
}

.tank.warning{
animation:shake .12s infinite alternate;
border-color:#ff6972;
}

.tank.warning .water{
background:linear-gradient(#ff8e68,#d63250);
}

@keyframes shake{
from{transform:rotate(-3deg)}
to{transform:rotate(3deg)}
}

.timer-text{
font-size:20px;
font-weight:bold;
}

.level{
display:inline-block;
margin:12px;
padding:7px 18px;
border-radius:20px;
background:#403a76;
color:#d7ddff;
}

.question{
font-size:22px;
line-height:1.8;
min-height:70px;
}

.board{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
margin:20px auto;
perspective:900px;
}

.place{
width:120px;
padding:10px;
border-radius:20px;
background:linear-gradient(145deg,#313763,#191d40);
border:2px solid #59649c;
box-shadow:0 12px 20px #0008;
}

.place-name{
font-size:14px;
color:#b9c3ef;
margin-bottom:10px;
}

.drop{
width:85px;
height:70px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
border:2px dashed #707ab0;
background:#0c1028;
font-size:34px;
font-weight:bold;
color:#6773aa;
}

.drop.over{
border-color:#ffe06d;
background:#39365a;
}

.drop.filled{
border-style:solid;
background:linear-gradient(145deg,#f2c957,#a86d1c);
color:#181529;
box-shadow:0 6px 0 #694719;
}

.digits{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:13px;
min-height:70px;
margin:15px 0;
}

.digit{
width:58px;
height:58px;
display:flex;
align-items:center;
justify-content:center;
border-radius:17px;
background:linear-gradient(145deg,#625da8,#37336e);
border:2px solid #817ed0;
font-size:27px;
font-weight:bold;
cursor:grab;
box-shadow:0 7px 0 #171832;
transition:.2s;
}

.digit:hover{
transform:translateY(-5px) rotate(-3deg);
}

.digit.used{
opacity:.18;
pointer-events:none;
}

.answers{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px;
margin:20px 0;
}

.answer{
min-width:120px;
padding:12px 18px;
border-radius:16px;
border:2px solid #626ba5;
background:#292e55;
color:#fff;
font-family:Tahoma;
font-size:17px;
cursor:pointer;
}

.answer:hover{
background:#3a4070;
transform:translateY(-3px);
}

.message{
min-height:35px;
font-size:18px;
font-weight:bold;
margin:12px;
}

.next,.restart{
display:none;
margin:10px auto;
padding:12px 28px;
border:0;
border-radius:18px;
font-family:Tahoma;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(145deg,#e7bb4d,#a86f1d);
color:#17152a;
box-shadow:0 6px 0 #684619;
}

.progress{
height:10px;
width:80%;
margin:18px auto;
background:#0d1129;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0;
background:linear-gradient(90deg,#51dcae,#ffe16c);
transition:.4s;
}

.cat{
position:absolute;
right:-190px;
bottom:135px;
width:150px;
height:170px;
z-index:20;
transition:right .7s;
filter:drop-shadow(0 12px 10px #0008);
}

.cat.show{right:20px}

.cat-head{
position:absolute;
top:15px;
left:28px;
width:95px;
height:85px;
border-radius:45%;
background:linear-gradient(145deg,#f4c18b,#bd714f);
border:3px solid #673e3c;
}

.cat-body{
position:absolute;
bottom:0;
left:30px;
width:90px;
height:90px;
border-radius:50%;
background:linear-gradient(145deg,#efb17d,#b96e4d);
border:3px solid #673e3c;
}

.ear{
position:absolute;
top:-4px;
width:34px;
height:34px;
background:#d78c67;
border:3px solid #673e3c;
transform:rotate(45deg);
}

.ear.left{left:5px}
.ear.right{right:5px}

.eye{
position:absolute;
top:32px;
width:10px;
height:13px;
border-radius:50%;
background:#19172b;
}

.eye.left{left:22px}
.eye.right{right:22px}

.nose{
position:absolute;
top:49px;
left:42px;
width:12px;
height:9px;
border-radius:50%;
background:#913e52;
}

.mouth{
position:absolute;
top:58px;
left:34px;
width:28px;
height:15px;
border-bottom:3px solid #5c3232;
border-radius:50%;
}

.paw{
position:absolute;
bottom:45px;
width:35px;
height:65px;
border-radius:20px;
background:#d99069;
border:3px solid #673e3c;
}

.paw.left{
left:15px;
transform:rotate(20deg);
}

.paw.right{
right:0;
transform:rotate(-25deg);
}

.cat.happy .paw.right{
animation:wave .4s infinite alternate;
}

@keyframes wave{
from{transform:rotate(-25deg)}
to{transform:rotate(-55deg)}
}

.cat.angry{
animation:angry .12s infinite alternate;
}

.cat.angry .mouth{
border-bottom:0;
border-top:3px solid #5c3232;
}

@keyframes angry{
from{transform:translateX(-2px)}
to{transform:translateX(3px)}
}

.number-road{
position:absolute;
bottom:0;
left:0;
right:0;
height:120px;
overflow:hidden;
background:linear-gradient(transparent,#050714);
border-top:2px solid #272d52;
}

.moving-number{
position:absolute;
bottom:15px;
color:#6875b4;
font-size:34px;
font-weight:bold;
opacity:.55;
animation:moveNumber linear infinite;
}

@keyframes moveNumber{
from{transform:translateX(120vw)}
to{transform:translateX(-150px)}
}

.result{
display:none;
padding:45px 20px;
text-align:center;
border-radius:30px;
background:linear-gradient(145deg,#252950,#14182f);
border:2px solid #626ba9;
}

.result h2{
color:#ffe27a;
font-size:31px;
}

.final-score{
font-size:65px;
font-weight:bold;
color:#ffe27a;
}

@media(max-width:700px){

header h1{font-size:26px}

.city{min-height:900px}

.panel{
width:96%;
padding:15px;
}

.question{
font-size:18px;
}

.place{
width:23%;
}

.place-name{
font-size:11px;
}

.drop{
width:60px;
height:60px;
font-size:28px;
}

.cat{
transform:scale(.75);
transform-origin:bottom right;
}

.cat.show{right:-5px}
}

</style>
</head>

<body>

<div class="game">

<header>
<h1>🏙️ شهر ارزش مکانی</h1>
<p>رقم‌ها را پیدا کن و شهر اعداد را نجات بده!</p>
</header>

<div class="stats">

<div class="stat">
🪙 سکه
<strong id="score">0</strong>
</div>

<div class="stat">
🔥 زنجیره
<strong id="streak">0</strong>
</div>

<div class="stat">
📍 مرحله
<strong id="stage">1</strong>
</div>

<div class="stat">
🎯 درست
<strong id="correct">0</strong>
</div>

</div>

<div class="city" id="city">

<div class="star" style="top:8%;left:8%"></div>
<div class="star" style="top:15%;left:20%"></div>
<div class="star" style="top:9%;left:39%"></div>
<div class="star" style="top:18%;left:61%"></div>
<div class="star" style="top:10%;left:79%"></div>
<div class="star" style="top:25%;left:90%"></div>
<div class="star" style="top:31%;left:13%"></div>

<div class="buildings">
<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>
</div>

<div class="cat" id="cat">

<div class="cat-head">
<div class="ear left"></div>
<div class="ear right"></div>
<div class="eye left"></div>
<div class="eye right"></div>
<div class="nose"></div>
<div class="mouth"></div>
</div>

<div class="cat-body"></div>
<div class="paw left"></div>
<div class="paw right"></div>

</div>

<div class="panel">

<div class="timer-area">

<div class="tank" id="tank">
<div class="water" id="water"></div>
</div>

<div class="timer-text">
💧 <span id="timer">30</span> ثانیه
</div>

</div>

<div class="level" id="level">
مرحله ۱
</div>

<div class="question" id="question"></div>

<div class="board" id="board"></div>

<div class="digits" id="digits"></div>

<div class="answers" id="answers"></div>

<div class="message" id="message"></div>

<button class="next" id="next" onclick="nextQuestion()">
➡️ مرحله بعد
</button>

<div class="progress">
<div class="progress-bar" id="progress"></div>
</div>

</div>

<div class="number-road" id="road"></div>

</div>

<div class="result" id="result">

<h2>🏆 مأموریت کامل شد!</h2>

<p>تو توانستی شهر ارزش مکانی را نجات بدهی.</p>

<div class="final-score" id="finalScore">0</div>

<p>
تعداد پاسخ‌های درست:
<strong id="finalCorrect">0</strong>
از ۱۰
</p>

<p>
درصد موفقیت:
<strong id="finalPercent">0%</strong>
</p>

<h3 id="finalMessage"></h3>

<button class="restart" id="restart" onclick="restartGame()">
🔄 دوباره بازی کن
</button>

</div>

</div>

<script>

/* =========================================
   داده‌های بازی
========================================= */

const questions=[

{
type:"drag",
number:["۴","۷","۳","۲"],
places:["هزارگان","صدگان","دهگان","یکان"]
},

{
type:"drag",
number:["۲","۲","۴","۲"],
places:["هزارگان","صدگان","دهگان","یکان"]
},

{
type:"value",
number:"۵۸۳۶",
digit:"۸",
correct:"صدگان",
options:["هزارگان","صدگان","دهگان","یکان"]
},

{
type:"value",
number:"۷۴۲۹",
digit:"۲",
correct:"دهگان",
options:["هزارگان","صدگان","دهگان","یکان"]
},

{
type:"expanded",
number:"۶۳۵۲",
correct:"۶۰۰۰ + ۳۰۰ + ۵۰ + ۲",
options:[
"۶۰۰۰ + ۳۰۰ + ۵۰ + ۲",
"۶۰۰ + ۳۰ + ۵ + ۲",
"۶۰۰۰ + ۳۰ + ۵ + ۲",
"۶۰۰ + ۳۰۰ + ۵۰ + ۲"
]
},

{
type:"number",
correct:"۴۰۷۵",
options:["۴۰۷۵","۴۷۰۵","۴۰۵۷","۴۷۵۰"]
},

{
type:"compare",
a:"۵۷۲۴",
b:"۵۲۷۴",
correct:">",
options:[">","<","=","≠"]
},

{
type:"missing",
number:"۶ _ ۲۵",
correct:"۷",
options:["۳","۵","۷","۹"]
},

{
type:"valueNumber",
number:"۸۴۳۶",
digit:"۴",
correct:"۴۰۰",
options:["۴۰","۴۰۰","۴۰۰۰","۴"]
},

{
type:"final",
number:"۷۲۵۴",
correct:"۷۰۰۰ + ۲۰۰ + ۵۰ + ۴",
options:[
"۷۰۰۰ + ۲۰۰ + ۵۰ + ۴",
"۷۰۰ + ۲۰۰ + ۵۰ + ۴",
"۷۰۰۰ + ۲۰ + ۵۰ + ۴",
"۷۰۰۰ + ۲۰۰ + ۵ + ۴"
]

}
];

let current=0;
let score=0;
let correct=0;
let streak=0;
let time=30;
let timer=null;
let placed={};


/* =========================================
   شروع
========================================= */

function start(){

createMovingNumbers();

loadQuestion();

}


/* =========================================
   اعداد متحرک
========================================= */

function createMovingNumbers(){

const road=document.getElementById("road");

const nums=[
"۰","۱","۲","۳","۴","۵",
"۶","۷","۸","۹",
"۱۲","۲۵","۴۸","۷۳","۹۱"
];

nums.forEach((n,i)=>{

let x=document.createElement("div");

x.className="moving-number";

x.innerText=n;

x.style.left=(-100-i*90)+"px";

x.style.animationDuration=(10+i%5)+"s";

x.style.animationDelay=(-i)+"s";

road.appendChild(x);

});

}


/* =========================================
   بارگذاری سوال
========================================= */

function loadQuestion(){

clearInterval(timer);

time=30;

placed={};

document.getElementById("timer").innerText=30;

document.getElementById("water").style.height="100%";

document.getElementById("tank").classList.remove("warning");

document.getElementById("message").innerText="";

document.getElementById("next").style.display="none";

document.getElementById("cat").className="cat";

document.getElementById("stage").innerText=current+1;

document.getElementById("level").innerText=
"مرحله "+(current+1)+" از "+questions.length;

updateProgress();

const q=questions[current];

if(q.type==="drag") createDragQuestion(q);
else createChoiceQuestion(q);

startTimer();

}


/* =========================================
   سوال Drag
========================================= */

function createDragQuestion(q){

document.getElementById("question").innerHTML=
"🔢 عدد <b>"+q.number.join("")+
"</b> را بساز. هر رقم را در خانه‌ی درست قرار بده.";

const board=document.getElementById("board");

board.innerHTML="";

q.places.forEach((place,index)=>{

const p=document.createElement("div");

p.className="place";

p.innerHTML=`
<div class="place-name">${place}</div>
<div class="drop" data-index="${index}">?</div>
`;

board.appendChild(p);

});

document.getElementById("answers").innerHTML="";

const digits=document.getElementById("digits");

digits.innerHTML="";

q.number.forEach((digit,index)=>{

const d=document.createElement("div");

d.className="digit";

d.innerText=digit;

d.draggable=true;

d.dataset.index=index;

d.dataset.digit=digit;

/*
هر رقم شناسه مستقل دارد.
حتی اگر چند رقم یکسان باشند.
*/

d.addEventListener("dragstart",e=>{

e.dataTransfer.setData(
"digitIndex",
index
);

e.dataTransfer.setData(
"digit",
digit
);

d.classList.add("dragging");

});

d.addEventListener("dragend",()=>{

d.classList.remove("dragging");

});

digits.appendChild(d);

});


document.querySelectorAll(".drop").forEach(zone=>{

zone.addEventListener("dragover",e=>{

e.preventDefault();

zone.classList.add("over");

});

zone.addEventListener("dragleave",()=>{

zone.classList.remove("over");

});

zone.addEventListener("drop",e=>{

e.preventDefault();

zone.classList.remove("over");

const digitIndex=
Number(e.dataTransfer.getData("digitIndex"));

const digit=
e.dataTransfer.getData("digit");

const target=
Number(zone.dataset.index);

placeDigit(
digitIndex,
digit,
target,
zone
);

});

});

}


/* =========================================
   قرار دادن رقم
========================================= */

function placeDigit(
digitIndex,
digit,
target,
zone
){

const q=questions[current];

if(q.number[target]===digit){

zone.innerText=digit;

zone.classList.add("filled");

placed[target]=digitIndex;

/*
فقط همان رقم استفاده شده
غیرفعال می‌شود.
*/

const digitElements=
document.querySelectorAll(".digit");

digitElements.forEach(d=>{

if(
Number(d.dataset.index)===digitIndex
){

d.classList.add("used");

}

});

checkDragComplete();

}else{

wrongAnswer();

}

}


/* =========================================
   بررسی کامل شدن Drag
========================================= */

function checkDragComplete(){

const q=questions[current];

if(
Object.keys(placed).length===
q.number.length
){

finishCorrect();

}

}


/* =========================================
   سوالات چهارگزینه‌ای
========================================= */

function createChoiceQuestion(q){

document.getElementById("digits").innerHTML="";

document.getElementById("board").innerHTML="";

let text="";

if(q.type==="value"){

text=
"🔎 در عدد <b>"+q.number+
"</b>، ارزش مکانی رقم <b>"+
q.digit+
"</b> چیست؟";

}

else if(q.type==="expanded"){

text=
"🧩 عدد <b>"+q.number+
"</b> را به صورت گسترده پیدا کن.";

}

else if(q.type==="number"){

text=
"🔢 کدام گزینه عدد موردنظر را نشان می‌دهد؟";

}

else if(q.type==="compare"){

text=
"⚖️ کدام علامت رابطه‌ی درست را نشان می‌دهد؟<br>"+
"<b>"+q.a+" &nbsp; ? &nbsp; "+q.b+"</b>";

}

else if(q.type==="missing"){

text=
"🕵️ رقم گمشده را پیدا کن:<br>"+
"<b>"+q.number+"</b>";

}

else if(q.type==="valueNumber"){

text=
"💰 ارزش رقم <b>"+q.digit+
"</b> در عدد <b>"+q.number+
"</b> چقدر است؟";

}

else{

text=
"🏆 مأموریت نهایی: شکل گسترده‌ی عدد <b>"+
q.number+"</b> را پیدا کن.";

}

document.getElementById("question").innerHTML=text;

const answers=
document.getElementById("answers");

answers.innerHTML="";

q.options.forEach(option=>{

const button=
document.createElement("button");

button.className="answer";

button.innerText=option;

button.onclick=()=>{

checkChoice(option,q.correct);

};

answers.appendChild(button);

});

}


/* =========================================
   بررسی گزینه
========================================= */

function checkChoice(answer,correctAnswer){

if(answer===correctAnswer){

finishCorrect();

}else{

wrongAnswer();

}

}


/* =========================================
   پاسخ درست
========================================= */

function finishCorrect(){

clearInterval(timer);

correct++;

streak++;

let points=
30+
time+
streak*5;

score+=points;

document.getElementById("score").innerText=score;

document.getElementById("correct").innerText=correct;

document.getElementById("streak").innerText=streak;

document.getElementById("message").innerText=
"🎉 آفرین! "+points+
" سکه به دست آوردی.";

document.getElementById("message").style.color="#65e0b0";

showHappyCat();

document.getElementById("next").style.display="block";

document.querySelectorAll(".answer").forEach(b=>{
b.disabled=true;
});

document.querySelectorAll(".digit").forEach(d=>{
d.draggable=false;
});

}


/* =========================================
   پاسخ غلط
========================================= */

function wrongAnswer(){

streak=0;

document.getElementById("streak").innerText=0;

document.getElementById("message").innerText=
"😾 اشتباه شد! دوباره فکر کن.";

document.getElementById("message").style.color="#ff8990";

showAngryCat();

}


/* =========================================
   گربه
========================================= */

function showHappyCat(){

const cat=document.getElementById("cat");

cat.className="cat show happy";

}

function showAngryCat(){

const cat=document.getElementById("cat");

cat.className="cat show angry";

}


/* =========================================
   زمان
========================================= */

function startTimer(){

timer=setInterval(()=>{

time--;

document.getElementById("timer").innerText=time;

document.getElementById("water").style.height=
(time/30*100)+"%";

if(time<=10){

document.getElementById("tank").classList.add("warning");

}

if(time<=0){

clearInterval(timer);

streak=0;

document.getElementById("streak").innerText=0;

document.getElementById("message").innerText=
"⏰ زمان تمام شد!";

document.getElementById("message").style.color="#ff8990";

showAngryCat();

document.getElementById("next").style.display="block";

document.querySelectorAll(".answer").forEach(b=>{
b.disabled=true;
});

document.querySelectorAll(".digit").forEach(d=>{
d.draggable=false;
});

}

},1000);

}


/* =========================================
   مرحله بعد
========================================= */

function nextQuestion(){

current++;

if(current>=questions.length){

finishGame();

}else{

loadQuestion();

}

}


/* =========================================
   نوار پیشرفت
========================================= */

function updateProgress(){

document.getElementById("progress").style.width=
(current/questions.length*100)+"%";

}


/* =========================================
   پایان
========================================= */

function finishGame(){

clearInterval(timer);

document.getElementById("city").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("finalScore").innerText=score;

document.getElementById("finalCorrect").innerText=correct;

let percent=
Math.round(correct/questions.length*100);

document.getElementById("finalPercent").innerText=
percent+"%";

let message="";

if(percent>=90){

message=
"🏆 فوق‌العاده! تو فرمانروای شهر ارزش مکانی هستی!";

}else if(percent>=70){

message=
"🌟 عالی بود! فقط کمی تمرین بیشتر لازم داری.";

}else if(percent>=50){

message=
"👏 خوب بود؛ با تمرین بیشتر قوی‌تر می‌شوی.";

}else{

message=
"📚 دوباره تلاش کن؛ شهر اعداد منتظر توست!";

}

document.getElementById("finalMessage").innerText=
message;

document.getElementById("restart").style.display="inline-block";

}


/* =========================================
   شروع دوباره
========================================= */

function restartGame(){

current=0;

score=0;

correct=0;

streak=0;

document.getElementById("score").innerText=0;

document.getElementById("correct").innerText=0;

document.getElementById("streak").innerText=0;

document.getElementById("city").style.display="block";

document.getElementById("result").style.display="none";

loadQuestion();

}

start();

</script>

</body>
</html>
