<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کلمه متفاوت</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#dbeafe,#fef3c7);
min-height:100vh;
color:#1e293b;
}

.container{
width:95%;
max-width:1000px;
margin:20px auto;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 10px 35px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2563eb;
font-size:32px;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#64748b;
margin-bottom:25px;
}

.stats{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:20px;
}

.stat{
background:#eff6ff;
border-radius:15px;
padding:12px 25px;
min-width:130px;
text-align:center;
font-weight:bold;
}

.stat span{
display:block;
font-size:25px;
color:#2563eb;
margin-top:5px;
}

.game{
background:#f8fafc;
border-radius:20px;
padding:25px;
text-align:center;
}

.level{
font-size:20px;
font-weight:bold;
color:#7c3aed;
margin-bottom:12px;
}

.hearts{
font-size:26px;
letter-spacing:5px;
margin:10px;
}

.instruction{
font-size:20px;
font-weight:bold;
margin:20px 0;
}

.words{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
max-width:700px;
margin:25px auto;
}

.word{
background:white;
border:3px solid #93c5fd;
border-radius:18px;
padding:25px 10px;
font-family:Tahoma,Arial,sans-serif;
font-size:26px;
font-weight:bold;
color:#1e40af;
cursor:pointer;
transition:.2s;
box-shadow:0 5px 10px rgba(0,0,0,.08);
}

.word:hover{
transform:translateY(-4px);
background:#eff6ff;
}

.word.correct{
background:#dcfce7;
border-color:#16a34a;
color:#15803d;
}

.word.wrong{
background:#fee2e2;
border-color:#ef4444;
color:#dc2626;
}

.word.disabled{
cursor:not-allowed;
opacity:.55;
}

.message{
min-height:45px;
font-size:20px;
font-weight:bold;
margin-top:20px;
}

.next{
display:none;
border:none;
background:#7c3aed;
color:white;
padding:14px 28px;
border-radius:12px;
font-family:Tahoma;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.progress{
height:12px;
background:#e2e8f0;
border-radius:10px;
overflow:hidden;
max-width:700px;
margin:20px auto;
}

.progress-bar{
height:100%;
width:0%;
background:#22c55e;
transition:.4s;
}

.report{
display:none;
background:#eff6ff;
border-radius:20px;
padding:30px;
text-align:center;
}

.report h2{
color:#2563eb;
}

.final-score{
font-size:42px;
font-weight:bold;
color:#16a34a;
margin:15px;
}

.restart{
border:none;
background:#2563eb;
color:white;
padding:14px 28px;
border-radius:12px;
font-family:Tahoma;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.footer{
text-align:center;
color:#64748b;
font-size:14px;
margin-top:20px;
}

@media(max-width:600px){

.container{
padding:15px;
}

h1{
font-size:26px;
}

.words{
grid-template-columns:1fr;
}

.word{
font-size:23px;
padding:20px 8px;
}

.stat{
min-width:105px;
padding:10px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>🔎 کلمه متفاوت</h1>

<div class="subtitle">
۲۰ مرحله برای تقویت دقت و طبقه‌بندی واژه‌ها
</div>

<div class="stats">

<div class="stat">
⭐ امتیاز
<span id="score">0</span>
</div>

<div class="stat">
🏆 رکورد
<span id="record">0</span>
</div>

<div class="stat">
📚 مرحله
<span id="stage">1</span>
</div>

</div>


<div class="game" id="gameArea">

<div class="level" id="level">
سطح ۱ | آسان
</div>

<div class="hearts" id="hearts">
❤️❤️❤️
</div>

<div class="instruction">
🔎 کدام کلمه با بقیه متفاوت است؟
</div>


<div class="words" id="words">
</div>


<div class="message" id="message">
</div>


<button
class="next"
id="nextButton"
onclick="nextStage()">

مرحله بعد ➜

</button>


<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>

</div>


<div class="report" id="report">

<h2>🎉 آفرین! بازی تمام شد</h2>

<div>
امتیاز نهایی شما
</div>

<div
class="final-score"
id="finalScore">
0
</div>

<div>
پاسخ‌های درست:
<strong id="finalCorrect">
0
</strong>
از ۲۰
</div>

<br>

<div>
درصد موفقیت:
<strong id="finalPercent">
0%
</strong>
</div>

<br>

<div>
🏆 رکورد:
<strong id="finalRecord">
0
</strong>
</div>

<br>

<div id="performance">
</div>

<button
class="restart"
onclick="restartGame()">

🔄 شروع دوباره

</button>

</div>


<div class="footer">
🌟 با دقت نگاه کن، فکر کن و انتخاب کن!
</div>

</div>


<script>

/* =========================
   سوالات ۲۰ مرحله
========================= */

const stages = [

/* 1 */
{
level:"سطح ۱ | آسان",
words:["سیب","موز","پرتقال","هویج"],
answer:"هویج",
hint:"سه کلمه میوه هستند و یکی سبزی است."
},

/* 2 */
{
level:"سطح ۱ | آسان",
words:["گربه","سگ","اسب","کبوتر"],
answer:"کبوتر",
hint:"سه کلمه حیوان چهارپا هستند."
},

/* 3 */
{
level:"سطح ۱ | آسان",
words:["مداد","پاک‌کن","دفتر","سیب"],
answer:"سیب",
hint:"سه کلمه وسایل مدرسه هستند."
},

/* 4 */
{
level:"سطح ۱ | آسان",
words:["قرمز","آبی","سبز","میز"],
answer:"میز",
hint:"سه کلمه رنگ هستند."
},

/* 5 */
{
level:"سطح ۱ | آسان",
words:["کتاب","دفتر","مداد","موز"],
answer:"موز",
hint:"سه کلمه با مدرسه ارتباط دارند."
},

/* 6 */
{
level:"سطح ۲ | متوسط",
words:["اتوبوس","قطار","دوچرخه","درخت"],
answer:"درخت",
hint:"سه کلمه وسیله نقلیه هستند."
},

/* 7 */
{
level:"سطح ۲ | متوسط",
words:["تابستان","بهار","پاییز","چهارشنبه"],
answer:"چهارشنبه",
hint:"سه کلمه نام فصل هستند."
},

/* 8 */
{
level:"سطح ۲ | متوسط",
words:["گلابی","هلو","هویج","انگور"],
answer:"هویج",
hint:"سه کلمه میوه هستند."
},

/* 9 */
{
level:"سطح ۲ | متوسط",
words:["شنبه","دوشنبه","جمعه","مهر"],
answer:"مهر",
hint:"سه کلمه نام روزهای هفته هستند."
},

/* 10 */
{
level:"سطح ۲ | متوسط",
words:["رودخانه","دریا","دریاچه","کوه"],
answer:"کوه",
hint:"سه کلمه با آب ارتباط دارند."
},

/* 11 */
{
level:"سطح ۲ | متوسط",
words:["پرنده","پروانه","زنبور","ماهی"],
answer:"ماهی",
hint:"سه کلمه می‌توانند در هوا پرواز کنند."
},

/* 12 */
{
level:"سطح ۳ | سخت",
words:["کتابخانه","مدرسه","آزمایشگاه","نانوا"],
answer:"نانوا",
hint:"سه مورد مکان‌های آموزشی هستند."
},

/* 13 */
{
level:"سطح ۳ | سخت",
words:["معلم","پزشک","پرستار","کتاب"],
answer:"کتاب",
hint:"سه کلمه شغل هستند."
},

/* 14 */
{
level:"سطح ۳ | سخت",
words:["صبح","ظهر","شب","زمستان"],
answer:"زمستان",
hint:"سه کلمه به زمان‌های یک روز مربوط هستند."
},

/* 15 */
{
level:"سطح ۳ | سخت",
words:["شادی","خوشحالی","سرور","غم"],
answer:"غم",
hint:"سه کلمه احساس مثبت را نشان می‌دهند."
},

/* 16 */
{
level:"سطح ۳ | سخت",
words:["دویدن","پریدن","شنا کردن","کتاب"],
answer:"کتاب",
hint:"سه مورد فعالیت بدنی هستند."
},

/* 17 */
{
level:"سطح ۳ | سخت",
words:["مهربانی","محبت","دوستی","سنگ"],
answer:"سنگ",
hint:"سه کلمه به روابط و رفتار انسانی مربوط هستند."
},

/* 18 */
{
level:"سطح ۳ | سخت",
words:["شیر","ماست","پنیر","هویج"],
answer:"هویج",
hint:"سه کلمه از فرآورده‌های شیر هستند."
},

/* 19 */
{
level:"سطح ۳ | سخت",
words:["خورشید","ماه","ستاره","رودخانه"],
answer:"رودخانه",
hint:"سه کلمه در آسمان دیده می‌شوند."
},

/* 20 */
{
level:"سطح ۳ | سخت",
words:["فکر","اندیشه","تفکر","دوچرخه"],
answer:"دوچرخه",
hint:"سه کلمه به فعالیت ذهنی مربوط هستند."
}

];


/* =========================
   متغیرها
========================= */

let stageIndex = 0;

let score = 0;

let correct = 0;

let lives = 3;

let answered = false;

let record =
parseInt(
localStorage.getItem(
"differentWordRecord"
)
) || 0;


document.getElementById(
"record"
).innerText = record;


/* =========================
   بارگذاری مرحله
========================= */

function loadStage(){

const stage =
stages[stageIndex];

lives = 3;

answered = false;


document.getElementById(
"stage"
).innerText =
stageIndex + 1;


document.getElementById(
"level"
).innerText =
stage.level;


document.getElementById(
"message"
).innerText =
"";


document.getElementById(
"nextButton"
).style.display =
"none";


updateHearts();

updateProgress();

createWords();

}


/* =========================
   ساخت کلمات
========================= */

function createWords(){

const container =
document.getElementById(
"words"
);

container.innerHTML = "";


const stage =
stages[stageIndex];


let words =
[...stage.words];


words.sort(
() =>
Math.random() - .5
);


words.forEach(
word => {

const button =
document.createElement(
"button"
);

button.className =
"word";

button.innerText =
word;


button.onclick =
function(){

checkWord(
button,
word
);

};


container.appendChild(
button
);

});

}


/* =========================
   بررسی انتخاب
========================= */

function checkWord(
button,
word
){

if(answered){

return;

}


const correctWord =
stages[
stageIndex
].answer;


if(word === correctWord){

answered = true;

correct++;

score +=
10 * lives;


button.classList.add(
"correct"
);


if(score > record){

record = score;

localStorage.setItem(
"differentWordRecord",
record
);

}


document.getElementById(
"score"
).innerText =
score;


document.getElementById(
"record"
).innerText =
record;


disableWords();


showMessage(
"🎉 آفرین! کلمه متفاوت را پیدا کردی.",
"#16a34a"
);


document.getElementById(
"nextButton"
).style.display =
"inline-block";


}else{

lives--;

button.classList.add(
"wrong"
);

button.disabled =
true;

button.classList.add(
"disabled"
);


updateHearts();


if(lives > 0){

showMessage(
"❌ این کلمه متفاوت نیست. دوباره دقت کن.",
"#dc2626"
);

}else{

answered = true;

showCorrectWord();

disableWords();


document.getElementById(
"nextButton"
).style.display =
"inline-block";

}

}

}


/* =========================
   نمایش پاسخ صحیح
========================= */

function showCorrectWord(){

const correctWord =
stages[
stageIndex
].answer;


const buttons =
document.querySelectorAll(
".word"
);


buttons.forEach(
button => {

if(
button.innerText ===
correctWord
){

button.classList.add(
"correct"
);

}

});


showMessage(
"❌ فرصت‌ها تمام شد. پاسخ درست: " +
correctWord,
"#dc2626"
);

}


/* =========================
   غیرفعال کردن کلمات
========================= */

function disableWords(){

const buttons =
document.querySelectorAll(
".word"
);


buttons.forEach(
button => {

button.disabled =
true;

});

}


/* =========================
   جان ها
========================= */

function updateHearts(){

let result = "";

for(
let i=0;
i<3;
i++
){

result +=
i < lives
? "❤️"
: "🖤";

}


document.getElementById(
"hearts"
).innerText =
result;

}


/* =========================
   پیام
========================= */

function showMessage(
text,
color
){

const message =
document.getElementById(
"message"
);

message.innerText =
text;

message.style.color =
color;

}


/* =========================
   مرحله بعد
========================= */

function nextStage(){

stageIndex++;


if(
stageIndex >=
stages.length
){

finishGame();

return;

}


loadStage();

}


/* =========================
   پیشرفت
========================= */

function updateProgress(){

const percent =
(stageIndex /
stages.length) *
100;


document.getElementById(
"progressBar"
).style.width =
percent + "%";

}


/* =========================
   پایان بازی
========================= */

function finishGame(){

document.getElementById(
"gameArea"
).style.display =
"none";


document.getElementById(
"report"
).style.display =
"block";


document.getElementById(
"finalScore"
).innerText =
score;


document.getElementById(
"finalCorrect"
).innerText =
correct;


document.getElementById(
"finalPercent"
).innerText =
Math.round(
(correct /
stages.length) *
100
) + "%";


document.getElementById(
"finalRecord"
).innerText =
record;


let performance = "";


if(correct >= 18){

performance =
"🏆 فوق‌العاده! دقت بسیار خوبی داری.";

}else if(correct >= 15){

performance =
"🌟 خیلی خوب بود! فقط کمی بیشتر دقت کن.";

}else if(correct >= 10){

performance =
"👍 خوب بود! با تمرین بیشتر بهتر می‌شوی.";

}else{

performance =
"💪 دوباره تلاش کن؛ با تمرین دقتت بیشتر می‌شود.";

}


document.getElementById(
"performance"
).innerText =
performance;

}


/* =========================
   شروع دوباره
========================= */

function restartGame(){

stageIndex = 0;

score = 0;

correct = 0;

lives = 3;

answered = false;


document.getElementById(
"score"
).innerText =
"0";


document.getElementById(
"report"
).style.display =
"none";


document.getElementById(
"gameArea"
).style.display =
"block";


loadStage();

}


/* =========================
   شروع
========================= */

loadStage();

</script>

</body>

</html>
