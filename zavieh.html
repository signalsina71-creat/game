/* =========================
   تبدیل درجه به رادیان
========================= */


function rad(deg){

return deg *
Math.PI /
180;

}


/* =========================
   رسم زاویه
========================= */


function drawAngle(angle){

const canvas=
document.getElementById(
"angleCanvas"
);

const ctx=
canvas.getContext("2d");


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/* پس زمینه */

ctx.fillStyle=
"#fefce8";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* مرکز */

const cx=325;

const cy=240;

const length=170;


/* زاویه اصلی */

const startAngle=
-rad(180);

const endAngle=
startAngle+
rad(angle);


/* خط اول */

ctx.beginPath();

ctx.moveTo(
cx,
cy
);

ctx.lineTo(
cx-length,
cy
);

ctx.strokeStyle=
"#7c3aed";

ctx.lineWidth=8;

ctx.lineCap="round";

ctx.stroke();


/* خط دوم */

ctx.beginPath();

ctx.moveTo(
cx,
cy
);

ctx.lineTo(
cx+
length*
Math.cos(endAngle),
cy+
length*
Math.sin(endAngle)
);

ctx.strokeStyle=
"#ec4899";

ctx.lineWidth=8;

ctx.stroke();


/* کمان */

ctx.beginPath();

ctx.arc(
cx,
cy,
70,
startAngle,
endAngle,
false
);

ctx.strokeStyle=
"#f59e0b";

ctx.lineWidth=6;

ctx.stroke();


/* نقطه مرکز */

ctx.beginPath();

ctx.arc(
cx,
cy,
10,
0,
Math.PI*2
);

ctx.fillStyle=
"#f59e0b";

ctx.fill();


/* عدد زاویه */

ctx.font=
"bold 28px Tahoma";

ctx.fillStyle=
"#334155";

ctx.textAlign=
"center";

ctx.fillText(
angle+"°",
cx-30,
cy-35
);

}

/* =========================
   ساخت گزینه ها
========================= */


function createOptions(options){

const container=
document.getElementById(
"options"
);

container.innerHTML="";


let shuffled=
[...options];


shuffled.sort(
()=>Math.random()-.5
);


shuffled.forEach(
option=>{

const button=
document.createElement(
"button"
);

button.className=
"option";

button.innerText=
option;


button.onclick=
function(){

checkAnswer(
button,
option
);

};


container.appendChild(
button
);

});

}


/* =========================
   بررسی پاسخ
========================= */


function checkAnswer(
button,
answer
){

if(answered)
return;


const s=
stages[current];


if(answer===s.answer){

answered=true;

correct++;

score+=
10*lives;


button.classList.add(
"correct"
);


if(score>record){

record=score;

localStorage.setItem(
"angleGameRecord",
record
);

}


document.getElementById(
"score"
).innerText=
score;


document.getElementById(
"record"
).innerText=
record;


disableButtons();


showMessage(
"🎉 آفرین! پاسخ درست است.",
"#16a34a"
);


document.getElementById(
"nextButton"
).style.display=
"inline-block";


}else{

lives--;

button.classList.add(
"wrong"
);

button.disabled=true;


updateHearts();


if(lives>0){

showMessage(
"❌ اشتباه شد! دوباره فکر کن.",
"#dc2626"
);

}else{

answered=true;

showCorrect();

disableButtons();


document.getElementById(
"nextButton"
).style.display=
"inline-block";

}

}

}

========================= */

const answer=
stages[current].answer;


const buttons=
document.querySelectorAll(
".option"
);


buttons.forEach(
button=>{

if(
button.innerText===
answer
){

button.classList.add(
"correct"
);

}

});


showMessage(
"💡 پاسخ درست: "+
answer,
"#dc2626"
);

}

========================= */

document
.querySelectorAll(
".option"
)
.forEach(
button=>{

}

}

========================= */

let text="";

let i=0;
i<3;
i++
){

text+=
i<lives

:"🖤";

}


document.getElementById(
"hearts"
).innerText=
text;

}

(
current/
stages.length
)*100;


document.getElementById(
"progressBar"
).style.width=
percent+"%";

}


/* =========================
   پایان
========================= */


function finishGame(){

document.getElementById(
"gameArea"
).style.display=
"none";


document.getElementById(
"report"
).style.display=
"block";


document.getElementById(
"finalScore"
).innerText=
score;


document.getElementById(
"finalCorrect"
).innerText=
correct;


document.getElementById(
"finalPercent"
).innerText=
Math.round(
(correct/
stages.length)*100
)+"%";


document.getElementById(
"finalRecord"
).innerText=
record;


let text="";


if(correct>=18){

text=
"🏆 فوق‌العاده! تو قهرمان سرزمین زاویه‌ها شدی!";

}
else if(correct>=15){

text=
"🌟 عالی بود! تو زاویه‌ها را خیلی خوب می‌شناسی.";

}
else if(correct>=10){

text=
"👍 خوب بود! با کمی تمرین بهتر می‌شوی.";

}
else{

text=
"💪 دوباره بازی کن تا جادوگر زاویه‌ها شوی!";

}


document.getElementById(
"performance"
).innerText=
text;

}


/* =========================
   شروع دوباره
========================= */


function restartGame(){

current=0;

score=0;

correct=0;

lives=3;

answered=false;


document.getElementById(
"score"
).innerText=
"0";


document.getElementById(
"report"
).style.display=
"none";


document.getElementById(
"gameArea"
).style.display=
"block";


loadStage();

}


/* =========================
   شروع
========================= */


loadStage();

</script>
